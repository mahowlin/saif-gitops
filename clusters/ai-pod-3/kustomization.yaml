apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ai-pod-3: Non-GPU cluster
resources:
  - ../_base/tier1-core
  - ../_base/tier2-isovalent
  - ../_base/tier4-observability
  - ../_base/tier5-demo

patches:
  # Cilium configuration
  - target:
      kind: Application
      name: cilium-config
    patch: |
      - op: add
        path: /spec/source/helm/parameters/-
        value:
          name: clusterName
          value: ai-pod-3
      - op: add
        path: /spec/source/helm/parameters/-
        value:
          name: ciliumConfig.apiHost
          value: api-int.cluster-3.example.com
      - op: add
        path: /spec/source/helm/parameters/-
        value:
          name: ipPool.start
          value: "10.0.1.100"
      - op: add
        path: /spec/source/helm/parameters/-
        value:
          name: ipPool.stop
          value: "10.0.1.109"

  # Vector exporter
  - target:
      kind: Application
      name: vector-exporter
    patch: |
      - op: add
        path: /spec/source/helm/parameters/-
        value:
          name: clusterName
          value: ai-pod-3

  # Splunk OTel
  - target:
      kind: Application
      name: splunk-otel
    patch: |
      - op: add
        path: /spec/source/helm/parameters/-
        value:
          name: clusterName
          value: cluster-3.example.com

  # Intersight OTEL
  - target:
      kind: Application
      name: intersight-otel
    patch: |
      - op: add
        path: /spec/source/helm/parameters/-
        value:
          name: clusterName
          value: ai-pod-3
      - op: add
        path: /spec/source/helm/parameters/-
        value:
          name: bladeSerial
          value: SERIALNUMBER03
