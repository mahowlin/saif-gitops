apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tier 2: Isovalent Enterprise Platform
# Cilium (CNI) + Hubble Timescape (network observability) + Tetragon (runtime security)
# hubble-timescape uses helm.parameters for cluster-specific hostname (patched in cluster kustomization.yaml)
resources:
  - cilium.yaml
  - tetragon.yaml
  - tetragon-catalogsource.yaml
  - hubble-timescape.yaml
  - hubble-timescape-scc.yaml
  - clickhouse-operator.yaml
  - vector-exporter.yaml
