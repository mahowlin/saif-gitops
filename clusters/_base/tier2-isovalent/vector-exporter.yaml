# Vector - Log collector for Hubble Timescape Push API
# Cluster-specific CLUSTER_NAME set via Kustomize patches
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vector-exporter
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mahowlin/saif-gitops.git
    targetRevision: main
    path: charts/vector
    helm:
      # Cluster-specific parameters added via Kustomize patches
      parameters: []
      values: |
        role: Agent
        logLevel: "info"  # DO NOT use debug - causes panic in Vector 0.51.0

        image:
          repository: registry.example.com:5000/isovalent/vector
          tag: 0.51.0-distroless-libc

        env:
          - name: PUSH_API_PASSWORD
            valueFrom:
              secretKeyRef:
                name: vector-push-credentials
                key: push-api-password
          # CLUSTER_NAME set via helm.parameters from Kustomize patch

        # Use emptyDir for data volume instead of hostPath
        # The default hostPath /var/lib/vector fails on OpenShift (permission denied)
        # emptyDir is acceptable for demo - only loses checkpoints on pod restart
        persistence:
          hostPath:
            enabled: false

        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
          runAsUser: 0

        extraVolumes:
          - name: hubble-logs
            hostPath:
              path: /var/run/cilium/hubble
              type: DirectoryOrCreate

        extraVolumeMounts:
          - name: hubble-logs
            mountPath: /var/run/cilium/hubble
            readOnly: true

        customConfig:
          data_dir: /vector-data-dir
          api:
            enabled: true
            address: 127.0.0.1:8686

          sources:
            hubble_logs:
              type: file
              include:
                - /var/run/cilium/hubble/hubble.log
                - /var/run/cilium/hubble/k8s-events.log
              read_from: beginning
              fingerprint:
                strategy: checksum
                lines: 1
              glob_minimum_cooldown_ms: 100
              ignore_checkpoints: true
            # Tetragon connection events (connectionLogs in Timescape)
            tetragon_logs:
              type: file
              include:
                - /var/run/cilium/hubble/tetragon-connections.log
              read_from: beginning
              fingerprint:
                strategy: checksum
                lines: 1
              glob_minimum_cooldown_ms: 100
              ignore_checkpoints: true

          transforms:
            add_cluster_name:
              type: remap
              inputs: [hubble_logs, tetragon_logs]
              source: |
                cluster_name = get_env_var!("CLUSTER_NAME")
                parsed = parse_json!(string!(.message))
                if exists(parsed.flow) {
                  parsed.flow.source.cluster_name = cluster_name
                  parsed.flow.destination.cluster_name = cluster_name
                }
                if exists(parsed.k8s_event) {
                  parsed.k8s_event.cluster = cluster_name
                }
                .message = encode_json(parsed)

          sinks:
            timescape_push_api:
              type: http
              inputs: [add_cluster_name]
              uri: "http://hubble-timescape-ingester.hubble-timescape:4260/push"
              method: post
              encoding:
                codec: raw_message
              framing:
                method: newline_delimited
              auth:
                strategy: basic
                user: timescape_push_api
                password: "${PUSH_API_PASSWORD}"
              batch:
                max_bytes: 10485760
                timeout_secs: 5
              request:
                timeout_secs: 60
                retry_attempts: 5
              buffer:
                type: disk
                max_size: 268435488

        tolerations:
          - effect: NoSchedule
            key: node-role.kubernetes.io/control-plane
          - effect: NoSchedule
            key: node-role.kubernetes.io/master

        service:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: hubble-timescape
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
