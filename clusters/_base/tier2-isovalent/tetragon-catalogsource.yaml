# Tetragon CatalogSource - prerequisite for Tetragon operator
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tetragon-catalogsource
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # Apply before other apps
spec:
  project: default
  source:
    repoURL: https://github.com/mahowlin/secure-ai-gitops.git
    targetRevision: main
    path: apps/tetragon-catalogsource
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-marketplace
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
