# Hubble Timescape - Flow Observability with ClickHouse
# Standardized configuration for ALL clusters
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hubble-timescape
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mahowlin/saif-gitops.git
    targetRevision: main
    path: charts/hubble-timescape
    helm:
      values: |
        # Timescape components - internal registry
        ingester:
          image:
            repository: registry.example.com:5000/isovalent/hubble-timescape
            tag: "v1.18.2"
          # connectionLogs = Tetragon connection events (PROCESS_CONNECT/CLOSE)
          connectionLogs:
            enabled: true
            pattern: "tetragon-connections\\.log"
          server:
            http:
              enabled: true
              basicAuth:
                enabled: true
                username: timescape_push_api
                secretName: hubble-timescape-ingester-creds

        server:
          image:
            repository: registry.example.com:5000/isovalent/hubble-timescape
            tag: "v1.18.2"

        migrate:
          image:
            repository: registry.example.com:5000/isovalent/hubble-timescape
            tag: "v1.18.2"
          ttl: "6h"

        ui:
          image:
            repository: registry.example.com:5000/isovalent/hubble-timescape-ui
            tag: "v1.18.2"
          service:
            type: LoadBalancer
          ingress:
            enabled: false
          observability:
            connections:
              enabled: true
            explorer:
              enabled: true
          networkSecurity:
            assessment:
              enabled: true
            enforcementPoints:
              enabled: true

        clickhouse:
          cluster:
            enabled: true
            image:
              repository: registry.example.com:5000/isovalent/clickhouse-server
              tag: "25.8.12.129-alpine"
            # ClickHouse needs memory for wide-column queries (130+ cols per flow)
            # 8Gi OOMs on observer.Observer/GetFlows with >500 flows
            resources:
              requests:
                cpu: 1000m
                memory: 8Gi
              limits:
                cpu: 4000m
                memory: 32Gi
            volumes:
              data:
                size: 100Gi
                storageClassName: lvms-nvme-raid10

        k8sExporter:
          enabled: true
          image:
            repository: registry.example.com:5000/isovalent/hubble-k8s-exporter
            tag: "v1.18.2"
          securityContext:
            privileged: true
            runAsUser: 0
          extraVolumes:
            - name: hubble-logs
              hostPath:
                path: /var/run/cilium/hubble
                type: DirectoryOrCreate
          extraVolumeMounts:
            - name: hubble-logs
              mountPath: /var/run/cilium/hubble

        trimmer:
          enabled: true
          flowsCount: 30000000
          trimIntervalMinutes: 60

        certgen:
          image:
            repository: registry.example.com:5000/isovalent/certgen
            tag: "v0.2.4"
  destination:
    server: https://kubernetes.default.svc
    namespace: hubble-timescape
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
