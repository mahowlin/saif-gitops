# Sealed Secrets - GPU-specific secrets (NIM, NGC)
# Deployed early (sync-wave -5) to ensure secrets exist before NVIDIA apps start
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-gpu
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mahowlin/saif-gitops.git
    targetRevision: main
    path: apps/sealed-secrets/_gpu
    directory:
      recurse: true
      include: '*.yaml'
      exclude: 'README.md'
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
