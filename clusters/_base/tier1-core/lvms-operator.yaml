# LVMS Operator - Dynamic PV Provisioning on mdadm RAID
# Provides TopoLVM-based storage class for workloads
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lvms-operator
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mahowlin/secure-ai-gitops.git
    targetRevision: main
    path: apps/lvms-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-storage
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 60s
        factor: 2
        maxDuration: 10m
