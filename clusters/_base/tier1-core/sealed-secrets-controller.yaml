# Sealed Secrets Controller - Day 2 GitOps managed
# Sync-wave -8: after IDMS (-10), before SealedSecrets (-5)
# Note: Shared key must be injected via sealed-secrets-key-bootstrap workflow
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-controller
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: default
  source:
    repoURL: https://github.com/mahowlin/secure-ai-gitops.git
    targetRevision: main
    path: apps/sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
