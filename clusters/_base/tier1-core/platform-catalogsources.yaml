# Platform CatalogSources - Red Hat and Certified operator catalogs
# Sync-wave -5: after IDMS (-10), before operators (0)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-catalogsources
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://github.com/mahowlin/secure-ai-gitops.git
    targetRevision: main
    path: apps/platform-catalogsources
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-marketplace
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
