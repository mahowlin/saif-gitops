name: Bootstrap Sealed Secrets Key

# Injects the shared Sealed Secrets key after controller is deployed by ArgoCD
# Run this ONCE per cluster after ArgoCD has synced sealed-secrets-controller
#
# Workflow order:
# 1. ArgoCD deploys sealed-secrets-controller (Day 2)
# 2. Run this workflow to inject shared key
# 3. ArgoCD can now sync SealedSecrets (they will decrypt)

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster to bootstrap'
        required: true
        type: choice
        options:
          - ai-pod-1
          - ai-pod-2
          - ai-pod-3
          - ai-pod-4
          - all

jobs:
  bootstrap:
    name: Bootstrap Key
    runs-on: [self-hosted, linux, saif-github-runner]
    container:
      image: ghcr.io/mahowlin/github-actions-container:${{ vars.CONTAINER_TAG }}
    strategy:
      matrix:
        cluster: ${{ github.event.inputs.cluster == 'all' && fromJSON('["ai-pod-1", "ai-pod-2", "ai-pod-3", "ai-pod-4"]') || fromJSON(format('["{0}"]', github.event.inputs.cluster)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch kubeconfig
        env:
          KUBECONFIG_REPO_TOKEN: ${{ secrets.KUBECONFIG_REPO_TOKEN }}
        run: |
          CLUSTER="${{ matrix.cluster }}"

          git clone --depth 1 --branch main \
            # Configure this URL for your kubeconfig storage repository
            "https://x-access-token:${KUBECONFIG_REPO_TOKEN}@github.com/mahowlin/saif-kubeconfigs.git" \
            /tmp/kubeconfigs

          cp "/tmp/kubeconfigs/kubeconfig-${CLUSTER}" /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig

          sed -i "s|server: https://localhost:[0-9]*|server: https://api.${CLUSTER}.example.com:6443|g" /tmp/kubeconfig

      - name: Check controller status
        id: check
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          CLUSTER="${{ matrix.cluster }}"

          echo "=== Checking Sealed Secrets on ${CLUSTER} ==="

          # Check if controller is deployed
          if ! oc get deployment sealed-secrets-controller -n sealed-secrets &>/dev/null; then
            echo "::error::Sealed Secrets controller not deployed on ${CLUSTER}"
            echo "Run ArgoCD sync first, then re-run this workflow"
            exit 1
          fi

          # Check if controller is ready
          READY=$(oc get deployment sealed-secrets-controller -n sealed-secrets -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
          if [ "$READY" != "1" ]; then
            echo "::warning::Controller not ready on ${CLUSTER}, waiting..."
            for i in {1..30}; do
              READY=$(oc get deployment sealed-secrets-controller -n sealed-secrets -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
              if [ "$READY" = "1" ]; then
                echo "Controller ready"
                break
              fi
              echo "Waiting for controller... ($i/30)"
              sleep 10
            done
          fi

          # Check if key already exists
          if oc get secret sealed-secrets-key -n sealed-secrets &>/dev/null; then
            echo "key_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Shared key already exists on ${CLUSTER}"
          else
            echo "key_exists=false" >> $GITHUB_OUTPUT
            echo "Key not found, will inject..."
          fi

      - name: Inject shared key
        if: steps.check.outputs.key_exists != 'true'
        env:
          SEALED_SECRETS_CERT: ${{ secrets.SEALED_SECRETS_CERT }}
          SEALED_SECRETS_KEY: ${{ secrets.SEALED_SECRETS_KEY }}
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          CLUSTER="${{ matrix.cluster }}"

          if [ -z "$SEALED_SECRETS_CERT" ] || [ -z "$SEALED_SECRETS_KEY" ]; then
            echo "::error::SEALED_SECRETS_CERT/KEY secrets not configured"
            exit 1
          fi

          echo "Injecting shared key on ${CLUSTER}..."

          cat <<EOF | oc apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: sealed-secrets-key
            namespace: sealed-secrets
            labels:
              sealedsecrets.bitnami.com/sealed-secrets-key: active
              app.kubernetes.io/name: sealed-secrets
          type: kubernetes.io/tls
          data:
            tls.crt: ${SEALED_SECRETS_CERT}
            tls.key: ${SEALED_SECRETS_KEY}
          EOF

          echo "✅ Shared key injected on ${CLUSTER}"

          # Restart controller to pick up new key
          echo "Restarting controller to use new key..."
          oc rollout restart deployment/sealed-secrets-controller -n sealed-secrets
          oc rollout status deployment/sealed-secrets-controller -n sealed-secrets --timeout=120s

          echo "✅ Controller restarted and ready"

      - name: Verify SealedSecrets
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          CLUSTER="${{ matrix.cluster }}"

          echo "=== Verification ==="
          echo "Controller:"
          oc get deployment sealed-secrets-controller -n sealed-secrets
          echo ""
          echo "Key:"
          oc get secret sealed-secrets-key -n sealed-secrets
          echo ""
          echo "SealedSecrets (if any):"
          oc get sealedsecrets -A 2>/dev/null || echo "No SealedSecrets found yet"

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/kubeconfig /tmp/kubeconfigs
