name: Apply Bootstrap

on:
  workflow_dispatch:

jobs:
  apply:
    name: Apply ArgoCD Bootstrap
    runs-on: [self-hosted, linux, saif-github-runner]
    container:
      image: ghcr.io/mahowlin/github-actions-container:${{ vars.CONTAINER_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Bootstrap and Configure ArgoCD
        run: |
          echo "${{ secrets.AI_POD_1_KUBECONFIG }}" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig

          echo "=== Configuring ArgoCD Repository Credentials ==="
          # Create secret for GitHub repository access
          oc -n openshift-gitops create secret generic github-repo-creds \
            --from-literal=type=git \
            --from-literal=url=https://github.com/mahowlin/saif-gitops.git \
            --from-literal=username=x-access-token \
            --from-literal=password=${{ secrets.ARGO_GIT_TOKEN }} \
            --dry-run=client -o yaml | oc apply -f -

          # Label the secret so ArgoCD recognizes it
          oc -n openshift-gitops label secret github-repo-creds \
            argocd.argoproj.io/secret-type=repository --overwrite

          echo ""
          echo "=== Applying ArgoCD App-of-Apps Configuration ==="
          oc apply -f argocd/bootstrap/app-of-apps.yaml

          echo ""
          echo "=== Restarting ArgoCD Repo Server to Pick Up New Credentials ==="
          REPO_POD=$(oc -n openshift-gitops get pods -o name | grep repo-server | head -1)
          if [ -n "$REPO_POD" ]; then
            oc -n openshift-gitops delete $REPO_POD
            echo "Waiting for repo server to restart..."
            sleep 15
          fi

          echo ""
          echo "=== Waiting for ArgoCD to Reconcile ==="
          sleep 30

          echo ""
          echo "=== Checking ArgoCD Application Status ==="
          SYNC_STATUS=$(oc -n openshift-gitops get application saif-apps -o jsonpath='{.status.sync.status}')
          HEALTH_STATUS=$(oc -n openshift-gitops get application saif-apps -o jsonpath='{.status.health.status}')

          echo "Sync Status: $SYNC_STATUS"
          echo "Health Status: $HEALTH_STATUS"

          # Check for errors
          if oc -n openshift-gitops get application saif-apps -o jsonpath='{.status.conditions}' | grep -q "ComparisonError"; then
            echo ""
            echo "⚠️  ArgoCD has comparison errors:"
            oc -n openshift-gitops get application saif-apps -o jsonpath='{.status.conditions}' | jq '.'
          fi

          if [ "$SYNC_STATUS" = "Synced" ]; then
            echo ""
            echo "✅ ArgoCD is successfully syncing from GitHub"
          else
            echo ""
            echo "⚠️  ArgoCD sync status is '$SYNC_STATUS' - may need more time to reconcile"
          fi

          # Clean up
          rm -f /tmp/kubeconfig
        env:
          KUBECONFIG: /tmp/kubeconfig
