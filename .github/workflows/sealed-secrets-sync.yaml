name: Seal Secrets

# Generates SealedSecret manifests from secrets-manifest.yaml
# Secret VALUES come from GitHub Secrets (referenced in manifest)
#
# Usage:
#   1. Edit apps/sealed-secrets/secrets-manifest.yaml to add/modify secrets
#   2. Run this workflow to regenerate all SealedSecrets
#   3. ArgoCD syncs the updated SealedSecrets to clusters

on:
  push:
    branches: [main]
    paths:
      - 'apps/sealed-secrets/secrets-manifest.yaml'
      - '.github/workflows/sealed-secrets-sync.yaml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which secrets to seal'
        required: true
        type: choice
        options:
          - all
          - _common
          - _gpu
        default: all
      dry_run:
        description: 'Dry run (show what would be generated)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  # All GitHub Secrets that may be referenced in secrets-manifest.yaml
  # Add new secrets here as they're added to the manifest
  HUBBLE_CLICKHOUSE_PASSWORD: ${{ secrets.HUBBLE_CLICKHOUSE_PASSWORD }}
  HUBBLE_PUSH_API_PASSWORD: ${{ secrets.HUBBLE_PUSH_API_PASSWORD }}
  SPLUNK_ACCESS_TOKEN: ${{ secrets.SPLUNK_ACCESS_TOKEN }}
  INTERSIGHT_API_KEY_ID: ${{ secrets.INTERSIGHT_API_KEY_ID }}
  INTERSIGHT_SECRET_KEY: ${{ secrets.INTERSIGHT_SECRET_KEY }}
  NVIDIA_NGC_API_KEY: ${{ secrets.NVIDIA_NGC_API_KEY }}
  HTTP_SERVER_USERNAME: ${{ secrets.HTTP_SERVER_USERNAME }}
  HTTP_SERVER_PASSWORD: ${{ secrets.HTTP_SERVER_PASSWORD }}

jobs:
  seal:
    name: Seal Secrets
    runs-on: [self-hosted, linux, saif-github-runner]
    container:
      image: ghcr.io/mahowlin/github-actions-container:${{ vars.CONTAINER_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kubeseal
        run: |
          KUBESEAL_VERSION="0.27.3"
          curl -sL "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz" | tar xz
          mv kubeseal /usr/local/bin/
          chmod +x /usr/local/bin/kubeseal
          kubeseal --version

      - name: Decode certificate
        env:
          SEALED_SECRETS_CERT: ${{ secrets.SEALED_SECRETS_CERT }}
        run: |
          if [ -z "$SEALED_SECRETS_CERT" ]; then
            echo "::error::SEALED_SECRETS_CERT secret not configured"
            exit 1
          fi
          echo "$SEALED_SECRETS_CERT" | base64 -d > /tmp/sealed-secrets.crt
          echo "Certificate decoded"

      - name: Generate SealedSecrets from manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="apps/sealed-secrets/secrets-manifest.yaml"
          SCOPE="${{ inputs.scope || 'all' }}"
          DRY_RUN="${{ inputs.dry_run || 'false' }}"

          echo "=== Sealed Secrets Generator ==="
          echo "Manifest: $MANIFEST"
          echo "Scope: $SCOPE"
          echo "Dry run: $DRY_RUN"
          echo ""

          # Parse manifest and generate secrets
          # Using Python for reliable YAML parsing
          python3 << 'PYTHON_SCRIPT'
          import yaml
          import os
          import subprocess
          import sys

          manifest_path = "apps/sealed-secrets/secrets-manifest.yaml"
          scope_filter = os.environ.get("SCOPE", "all")
          dry_run = os.environ.get("DRY_RUN", "false") == "true"
          cert_path = "/tmp/sealed-secrets.crt"

          with open(manifest_path) as f:
              manifest = yaml.safe_load(f)

          generated = 0
          skipped = 0
          errors = 0

          for ns_config in manifest.get("secrets", []):
              namespace = ns_config["namespace"]
              scope = ns_config.get("scope", "_common")

              # Filter by scope
              if scope_filter != "all" and scope != scope_filter:
                  continue

              for secret in ns_config.get("secrets", []):
                  secret_name = secret["name"]
                  output_dir = f"apps/sealed-secrets/{scope}/{namespace}"
                  output_file = f"{output_dir}/{secret_name.replace('hubble-timescape-', '').replace('-creds', '-creds')}.yaml"

                  # Simplify output filenames
                  if secret_name.startswith("hubble-timescape-") and secret_name.endswith("-creds"):
                      component = secret_name.replace("hubble-timescape-", "").replace("-creds", "")
                      output_file = f"{output_dir}/{component}-creds.yaml"
                  elif secret_name == "vector-push-credentials":
                      output_file = f"{output_dir}/vector-push-credentials.yaml"
                  else:
                      output_file = f"{output_dir}/{secret_name}.yaml"

                  print(f"\n--- {namespace}/{secret_name} ---")
                  print(f"  Scope: {scope}")
                  print(f"  Output: {output_file}")

                  # Build secret YAML
                  secret_yaml = f"""apiVersion: v1
          kind: Secret
          metadata:
            name: {secret_name}
            namespace: {namespace}
          type: Opaque
          stringData:
          """

                  missing_keys = []
                  for key in secret.get("keys", []):
                      key_name = key["name"]
                      github_secret = key["github_secret"]
                      multiline = key.get("multiline", False)

                      value = os.environ.get(github_secret, "")
                      if not value:
                          missing_keys.append(github_secret)
                          continue

                      if multiline:
                          # Multiline value (like PEM keys)
                          secret_yaml += f"  {key_name}: |\n"
                          for line in value.split("\n"):
                              secret_yaml += f"    {line}\n"
                      else:
                          # Single line value
                          secret_yaml += f'  {key_name}: "{value}"\n'

                  if missing_keys:
                      print(f"  ⚠️  SKIPPED - Missing GitHub Secrets: {', '.join(missing_keys)}")
                      skipped += 1
                      continue

                  if dry_run:
                      print(f"  🔍 DRY RUN - Would generate SealedSecret")
                      generated += 1
                      continue

                  # Create output directory
                  os.makedirs(output_dir, exist_ok=True)

                  # Seal the secret
                  try:
                      result = subprocess.run(
                          ["kubeseal", "--cert", cert_path, "--format", "yaml"],
                          input=secret_yaml,
                          capture_output=True,
                          text=True,
                          check=True
                      )

                      with open(output_file, "w") as f:
                          f.write("---\n")
                          f.write(result.stdout)

                      print(f"  ✅ Generated")
                      generated += 1

                  except subprocess.CalledProcessError as e:
                      print(f"  ❌ ERROR: {e.stderr}")
                      errors += 1

          print(f"\n=== Summary ===")
          print(f"Generated: {generated}")
          print(f"Skipped (missing secrets): {skipped}")
          print(f"Errors: {errors}")

          if errors > 0:
              sys.exit(1)
          PYTHON_SCRIPT
        env:
          SCOPE: ${{ inputs.scope || 'all' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

      - name: Show generated files
        run: |
          echo "=== Generated SealedSecrets ==="
          find apps/sealed-secrets/_common apps/sealed-secrets/_gpu -name "*.yaml" -type f 2>/dev/null | sort || echo "No files found"

      - name: Commit SealedSecrets
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apps/sealed-secrets/_common/ apps/sealed-secrets/_gpu/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          SCOPE="${{ inputs.scope || 'all' }}"
          git commit -m "chore: Update SealedSecrets (scope: ${SCOPE})

          Generated by sealed-secrets-sync.yaml workflow
          Run: ${{ github.run_id }}"

          git push
          echo "✅ SealedSecrets committed and pushed"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/sealed-secrets.crt
