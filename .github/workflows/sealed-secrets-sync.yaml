name: Seal Secrets

# Generates SealedSecret manifests from secrets-manifest.yaml
# Secret VALUES come from GitHub Secrets (referenced in manifest)
#
# Usage:
#   1. Edit apps/sealed-secrets/secrets-manifest.yaml to add/modify secrets
#   2. Run this workflow to regenerate all SealedSecrets
#   3. ArgoCD syncs the updated SealedSecrets to clusters

on:
  workflow_dispatch:
    inputs:
      allow_secret_access:
        description: 'Explicit opt-in: read configured Secrets; dry_run=false also commits generated manifests'
        required: true
        type: boolean
        default: false
      scope:
        description: 'Which secrets to seal'
        required: true
        type: choice
        options:
          - all
          - _common
          - _gpu
          - _splunk
        default: all
      dry_run:
        description: 'Dry run (show what would be generated)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  seal:
    name: Seal Secrets
    if: github.event_name == 'workflow_dispatch' && inputs.allow_secret_access == true
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    container:
      image: ${{ vars.RUNNER_CONTAINER_IMAGE }}
    env:
      # All GitHub Secrets that may be referenced in secrets-manifest.yaml
      # Add new secrets here as they're added to the manifest
      HUBBLE_CLICKHOUSE_PASSWORD: ${{ secrets.HUBBLE_CLICKHOUSE_PASSWORD }}
      HUBBLE_PUSH_API_PASSWORD: ${{ secrets.HUBBLE_PUSH_API_PASSWORD }}
      RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
      RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
      SPLUNK_ACCESS_TOKEN: ${{ secrets.SPLUNK_ACCESS_TOKEN }}
      INTERSIGHT_API_KEY_ID: ${{ secrets.INTERSIGHT_API_KEY_ID }}
      INTERSIGHT_SECRET_KEY: ${{ secrets.INTERSIGHT_SECRET_KEY }}
      NVIDIA_NGC_API_KEY: ${{ secrets.NVIDIA_NGC_API_KEY }}
      HTTP_SERVER_USERNAME: ${{ secrets.HTTP_SERVER_USERNAME }}
      HTTP_SERVER_PASSWORD: ${{ secrets.HTTP_SERVER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kubeseal
        run: |
          KUBESEAL_VERSION="0.27.3"
          curl -sL "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz" | tar xz
          mv kubeseal /usr/local/bin/
          chmod +x /usr/local/bin/kubeseal
          kubeseal --version

      - name: Decode certificate
        env:
          SEALED_SECRETS_CERT: ${{ secrets.SEALED_SECRETS_CERT }}
        run: |
          if [ -z "$SEALED_SECRETS_CERT" ]; then
            echo "::error::SEALED_SECRETS_CERT secret not configured"
            exit 1
          fi
          umask 077
          SEAL_CERT_PATH=$(mktemp "$RUNNER_TEMP/sealed-secrets-cert.XXXXXX")
          echo "SEAL_CERT_PATH=$SEAL_CERT_PATH" >> "$GITHUB_ENV"
          printf '%s' "$SEALED_SECRETS_CERT" | base64 -d > "$SEAL_CERT_PATH"
          echo "Certificate decoded"

      - name: Generate SealedSecrets from manifest
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python3 .github/scripts/seal_manifest.py | tee "$RUNNER_TEMP/sealed-output-paths.txt"

      - name: Commit SealedSecrets
        if: inputs.dry_run != true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          set -euo pipefail
          python3 .github/scripts/seal_manifest.py --stage-paths "$RUNNER_TEMP/sealed-output-paths.txt"

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          export SCOPE="${{ inputs.scope }}"
          git commit -m "chore: Update SealedSecrets (scope: ${SCOPE})

          Generated by sealed-secrets-sync.yaml workflow
          Run: ${{ github.run_id }}"

          git push
          echo "✅ SealedSecrets committed and pushed"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -n "${SEAL_CERT_PATH:-}" ]; then
            rm -f -- "$SEAL_CERT_PATH"
          fi
