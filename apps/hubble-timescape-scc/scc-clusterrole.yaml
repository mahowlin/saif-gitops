# ClusterRole for custom Hubble Timescape SCC
#
# OpenShift automatically creates ClusterRoles for built-in SCCs
# (e.g., system:openshift:scc:anyuid), but NOT for custom SCCs.
# This must be explicitly created for the ClusterRoleBinding to work.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:scc:hubble-timescape-anyuid
rules:
  - apiGroups: ["security.openshift.io"]
    resourceNames: ["hubble-timescape-anyuid"]
    resources: ["securitycontextconstraints"]
    verbs: ["use"]
