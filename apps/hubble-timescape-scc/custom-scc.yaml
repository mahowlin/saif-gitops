# Custom SCC for Hubble Timescape on OpenShift
# Based on 'anyuid' but allows seccompProfile (which the chart sets)
#
# The hubble-timescape chart sets seccompProfile: RuntimeDefault on all pods.
# OpenShift's built-in 'anyuid' SCC does not allow explicit seccomp profiles.
# This custom SCC allows anyuid + seccomp for Timescape components.
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: hubble-timescape-anyuid
  annotations:
    kubernetes.io/description: >-
      Custom SCC for Hubble Timescape. Allows running as any UID with
      explicit seccomp profiles (RuntimeDefault). Based on anyuid SCC.
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
allowedCapabilities: null
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
groups: []
priority: 10
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - MKNOD
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
seccompProfiles:
  - RuntimeDefault
  - runtime/default
supplementalGroups:
  type: RunAsAny
users: []
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
