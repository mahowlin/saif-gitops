secrets:
- namespace: hubble-timescape
  scope: _common
  secrets:
  - name: hubble-timescape-ingester-creds
    keys:
    - name: CLICKHOUSE_PASSWORD
      github_secret: HUBBLE_CLICKHOUSE_PASSWORD
    - name: PUSH_API_PASSWORD
      github_secret: HUBBLE_PUSH_API_PASSWORD
    - name: AWS_ACCESS_KEY_ID
      github_secret: RUSTFS_ACCESS_KEY
    - name: AWS_SECRET_ACCESS_KEY
      github_secret: RUSTFS_SECRET_KEY
  - name: timescape-object-writer
    keys:
    - name: AWS_ACCESS_KEY_ID
      github_secret: RUSTFS_ACCESS_KEY
    - name: AWS_SECRET_ACCESS_KEY
      github_secret: RUSTFS_SECRET_KEY
  - name: hubble-timescape-migrate-creds
    keys:
    - name: CLICKHOUSE_PASSWORD
      github_secret: HUBBLE_CLICKHOUSE_PASSWORD
  - name: hubble-timescape-server-creds
    keys:
    - name: CLICKHOUSE_PASSWORD
      github_secret: HUBBLE_CLICKHOUSE_PASSWORD
  - name: hubble-timescape-analyzer-creds
    keys:
    - name: CLICKHOUSE_PASSWORD
      github_secret: HUBBLE_CLICKHOUSE_PASSWORD
  - name: hubble-timescape-trimmer-creds
    keys:
    - name: CLICKHOUSE_PASSWORD
      github_secret: HUBBLE_CLICKHOUSE_PASSWORD
  - name: vector-push-credentials
    keys:
    - name: push-api-password
      github_secret: HUBBLE_PUSH_API_PASSWORD
- namespace: splunk-otel
  scope: _splunk
  secrets:
  - name: splunk-otel-secret
    keys:
    - name: splunk_observability_access_token
      github_secret: SPLUNK_ACCESS_TOKEN
- namespace: splunk-reporter
  scope: _splunk
  secrets:
  - name: splunk-credentials
    keys:
    - name: api-token
      github_secret: SPLUNK_ACCESS_TOKEN
- namespace: intersight-otel
  scope: _splunk
  secrets:
  - name: intersight-api-credentials
    keys:
    - name: intersight-key-id
      github_secret: INTERSIGHT_API_KEY_ID
    - name: intersight-key
      github_secret: INTERSIGHT_SECRET_KEY
      multiline: true
  - name: splunk-credentials
    keys:
    - name: access-token
      github_secret: SPLUNK_ACCESS_TOKEN
- namespace: nim-llm
  scope: _gpu
  secrets:
  - name: ngc-api-key
    keys:
    - name: NGC_API_KEY
      github_secret: NVIDIA_NGC_API_KEY
  - name: webserver-credentials
    keys:
    - name: username
      github_secret: HTTP_SERVER_USERNAME
    - name: password
      github_secret: HTTP_SERVER_PASSWORD
