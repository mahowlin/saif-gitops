# Sensitive File Monitoring TracingPolicy
# Monitors access to sensitive files for security demos
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sensitive-file-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  file:
    file_paths_patterns:
    - type: PathPrefix
      path_prefix:
        prefix: "/etc/passwd"
    - type: PathPrefix
      path_prefix:
        prefix: "/etc/shadow"
    - type: FilePrefixSuffix
      file_prefix_suffix:
        prefix: "/home/"
        suffix: ".ssh/authorized_keys"
    - type: PathPrefix
      path_prefix:
        prefix: "/root/.ssh/"
    monitorHostFiles: true
    podSelector: {}
