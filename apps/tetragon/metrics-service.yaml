# Service to expose Tetragon metrics for Prometheus scraping
apiVersion: v1
kind: Service
metadata:
  name: tetragon-metrics
  namespace: tetragon
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/component: metrics
spec:
  selector:
    app.kubernetes.io/name: tetragon
  ports:
    - name: metrics
      port: 2112
      targetPort: 2112
      protocol: TCP
  clusterIP: None  # Headless service for DaemonSet
