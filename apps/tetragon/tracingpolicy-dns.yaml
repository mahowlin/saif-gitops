# DNS Visibility TracingPolicy
# Enables process_dns events to see all DNS queries from pods
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: dns-visibility
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parser:
    udp:
      enable: true
      cgroup: true
      deleteIdleSocketInterval: 60
    dns:
      enable: true
      ports:
        - 53
