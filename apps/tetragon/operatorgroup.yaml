# OperatorGroup for Tetragon operator
# Follows CLIFE pattern - empty spec watches all namespaces
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: tetragon
  namespace: tetragon
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  upgradeStrategy: Default
