# Subscription for Tetragon Enterprise operator
# Uses existing CatalogSource in openshift-marketplace (local registry mirror)
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: tetragon-operator
  namespace: tetragon
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    operators.coreos.com/tetragon-operator.tetragon: ""
spec:
  name: tetragon-operator
  channel: v1.18
  source: tetragon-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
