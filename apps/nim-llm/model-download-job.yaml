apiVersion: batch/v1
kind: Job
metadata:
  name: model-download
  namespace: nim-llm
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: downloader
        image: registry.example.com:5000/openshift4/ose-tools-rhel9:latest
        command:
        - /bin/bash
        - /download-config/download.sh
        volumeMounts:
        - name: model-store
          mountPath: /model-store
        - name: download-config
          mountPath: /download-config
          readOnly: true
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        env:
        - name: MODEL_DIR
          valueFrom:
            configMapKeyRef:
              name: model-download-config
              key: model-dir
        - name: MODEL_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: model-download-config
              key: base-url
        - name: MODEL_STORE_ROOT
          value: /model-store
        - name: MODEL_FILES_FILE
          value: /download-config/files
        - name: MODEL_CHECKSUM_FILE
          value: /download-config/sha256sums
        - name: WEB_USERNAME
          valueFrom:
            secretKeyRef:
              name: webserver-credentials
              key: username
        - name: WEB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: webserver-credentials
              key: password
      volumes:
      - name: model-store
        persistentVolumeClaim:
          claimName: nim-cache-pvc
      - name: download-config
        configMap:
          name: model-download-config
