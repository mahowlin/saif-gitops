# Certified Operators CatalogSource (local mirror)
# Used by subscriptions that reference "certified-operators-local"
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: certified-operators-local
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  image: registry.example.com:5000/redhat/certified-operator-index:v4.19
  displayName: Certified Operators (local mirror)
  publisher: Red Hat Partners (local mirror)
  updateStrategy:
    registryPoll:
      interval: 30m
