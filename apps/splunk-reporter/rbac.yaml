apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-updater
  namespace: splunk-reporter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-updater
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "persistentvolumes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies", "ciliumclusterwidenetworkpolicies"]
    verbs: ["list"]
  - apiGroups: ["config.openshift.io"]
    resources: ["infrastructures", "clusterversions"]
    verbs: ["get"]
  - apiGroups: ["lvm.topolvm.io"]
    resources: ["lvmclusters"]
    verbs: ["get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["apps.nvidia.com"]
    resources: ["nimservices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-updater
subjects:
  - kind: ServiceAccount
    name: dashboard-updater
    namespace: splunk-reporter
roleRef:
  kind: ClusterRole
  name: dashboard-updater
  apiGroup: rbac.authorization.k8s.io
