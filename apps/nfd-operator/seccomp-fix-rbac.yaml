# RBAC for NFD seccomp fix hook
# Patches OLM-managed deployment to add pod-level seccompProfile
# Required because OLM's CSV omits pod-level seccomp, causing SCC admission
# to inject the deprecated alpha annotation rejected by K8s 1.32
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfd-seccomp-patcher
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nfd-seccomp-patcher
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nfd-seccomp-patcher
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nfd-seccomp-patcher
subjects:
  - kind: ServiceAccount
    name: nfd-seccomp-patcher
    namespace: openshift-nfd
