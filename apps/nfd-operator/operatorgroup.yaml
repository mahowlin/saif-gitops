# OperatorGroup for NFD Operator
# OwnNamespace mode - watches only its own namespace
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-nfd
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  targetNamespaces:
    - openshift-nfd
  upgradeStrategy: Default
