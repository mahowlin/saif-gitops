# NFD ServiceAccounts
# Required for NFD operator to create master, worker, gc pods
# These are normally created by OLM but needed for direct deployment
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfd-gc
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfd-master
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfd-worker
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfd-topology-updater
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfd-prune
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
