# Role for NFD Operator (namespace-scoped permissions)
# Extracted from nfd.4.19.0-202601120612 CSV
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nfd-manager
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups: ["", coordination.k8s.io]
    resources: [configmaps, leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: ["*"]
  - apiGroups: [""]
    resources: [pods, services, endpoints, persistentvolumeclaims, events, configmaps, secrets, serviceaccounts, nodes]
    verbs: ["*"]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, replicasets, statefulsets]
    verbs: ["*"]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors]
    verbs: [get, create]
  - apiGroups: [nfd.openshift.io]
    resources: ["*"]
    verbs: ["*"]
