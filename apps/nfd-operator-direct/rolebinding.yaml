# RoleBinding for NFD Operator (namespace-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nfd-manager
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nfd-manager
subjects:
  - kind: ServiceAccount
    name: nfd-manager
    namespace: openshift-nfd
