apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: mnist-dns-visibility
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: mnist-ml-lab
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            dns.operator.openshift.io/daemonset-dns: default
            k8s:io.kubernetes.pod.namespace: openshift-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
            - port: "5353"
              protocol: UDP
            - port: "5353"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
