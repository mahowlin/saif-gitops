apiVersion: v1
kind: Service
metadata:
  name: mnist-webapp
  namespace: mnist-ml-lab
  labels:
    app: mnist-webapp
  annotations:
    io.cilium.pool: demo-apps
spec:
  type: LoadBalancer
  selector:
    app: mnist-webapp
  ports:
    - name: http
      port: 80
      targetPort: http
