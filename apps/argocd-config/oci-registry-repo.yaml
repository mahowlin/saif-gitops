# ArgoCD OCI Registry Configuration
# Enables ArgoCD to pull Helm charts from the internal OCI registry
#
# This secret configures the registry.example.com:5000 registry for OCI Helm charts.
# TLS trust is handled by argocd-tls-certs-cm (configured in Day 1 post-install).
#
# ArgoCD OCI rules:
# - url = just the registry host (no oci:// prefix, no path)
# - Application chart field = full path (e.g., charts/platform-idms)
# - ArgoCD constructs: oci://<url>/<chart>:<version>
apiVersion: v1
kind: Secret
metadata:
  name: saif-oci-registry
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  # OCI registry URL - just the registry host, no path
  url: registry.example.com:5000
  # Repository name (for display in ArgoCD UI)
  name: SAIF OCI Registry
  # Enable OCI support - ArgoCD adds oci:// prefix internally
  enableOCI: "true"
  # Registry type
  type: helm
