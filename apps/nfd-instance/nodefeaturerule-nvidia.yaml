# NodeFeatureRule to add generic NVIDIA GPU label for GPU Operator
# GPU Operator expects feature.node.kubernetes.io/pci-10de.present=true
# but NFD creates labels with full device spec (pci-10de_xxxx_xxxx_xxxx.present)
# This rule bridges the gap by creating the expected label
apiVersion: nfd.openshift.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: nvidia-gpu-label
  namespace: openshift-nfd
spec:
  rules:
    - name: nvidia-gpu-present
      labels:
        feature.node.kubernetes.io/pci-10de.present: "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["10de"]}  # NVIDIA vendor ID
