      session_log/ttl: event_time + INTERVAL 2 day
      text_log/engine: _removed_
      text_log/ttl: event_time + INTERVAL 2 day
      trace_log/engine: _removed_
      trace_log/ttl: event_time + INTERVAL 2 day
      zookeeper_log/engine: _removed_
      zookeeper_log/ttl: event_time + INTERVAL 2 day
      max_table_size_to_drop: 0
      prometheus/endpoint: /metrics
      prometheus/port: 8001
      prometheus/metrics: true
      prometheus/events: true
      prometheus/asynchronous_metrics: true
      mysql_port: _removed_
      postgresql_port: _removed_
      # Options below are based on
      # https://github.com/Altinity/clickhouse-operator/blob/77025ca8d774b46d8381f5b45b92275d28fb2d45/tests/e2e/manifests/chi/test-033-tls.yaml
      # and https://clickhouse.com/docs/en/guides/sre/configuring-ssl/

      # enable secure ports, disable insecure ports
      tcp_port: _removed_
      tcp_port_secure: 9440
      http_port: _removed_
      https_port: 8443
      interserver_http_port: _removed_
      interserver_https_port: 9009

      # server TLS settings
      openSSL/server/certificateFile: "/etc/clickhouse-server/tls/tls.crt"
      openSSL/server/privateKeyFile: "/etc/clickhouse-server/tls/tls.key"
      openSSL/server/loadDefaultCAFile: false
      # none means we aren't requesting client certificates from clients
      openSSL/server/verificationMode: "none"
      openSSL/server/disableProtocols: "sslv2,sslv3,tlsv1,tlsv1_1,tlsv1_2"
      openSSL/server/dhParamsFile: _removed_
      openSSL/server/preferServerCiphers: false
      openSSL/server/requireTLSv1: false
      openSSL/server/requireTLSv1_1: false
      openSSL/server/requireTLSv1_2: false
      openSSL/server/requireTLSv1_3: true
      openSSL/server/cacheSessions: true

      # client TLS settings
      # needed for ClickHouse to use public services, eg: S3
      openSSL/client/loadDefaultCAFile: true

      openSSL/client/cacheSessions: true
      openSSL/client/disableProtocols: "sslv2,sslv3,tlsv1,tlsv1_1,tlsv1_2"
      openSSL/client/preferServerCiphers: true
      # strict verifies the server cert when configured on the client
      openSSL/client/verificationMode: "strict"
      openSSL/client/invalidCertificateHandler/name: RejectCertificateHandler
    profiles:
      timescape_admin_role/readonly: 0      # allow all queries       (SELECT, SHOW, DESCRIBE, EXISTS, INSERT, OPTIMIZE, SET, USE)
      timescape_admin_role/allow_ddl: 1     # allow DDL queries       (CREATE, ALTER, RENAME, ATTACH, DETACH, DROP, TRUNCATE)
      timescape_admin_role/log_queries: 1
      timescape_admin_role/skip_unavailable_shards: 1
      timescape_admin_role/prefer_global_in_and_join: 1
      # disable the query profiler due to us hitting https://github.com/ClickHouse/ClickHouse/issues/15638 on some arm64 hosts
      timescape_admin_role/query_profiler_cpu_time_period_ns: "0"
      timescape_admin_role/query_profiler_real_time_period_ns: "0"
      timescape_readwrite_role/readonly: 0  # allow all queries       (SELECT, SHOW, DESCRIBE, EXISTS, INSERT, OPTIMIZE, SET, USE)
      timescape_readwrite_role/allow_ddl: 0 # disallow DDL queries    (CREATE, ALTER, RENAME, ATTACH, DETACH, DROP, TRUNCATE)
      timescape_readwrite_role/log_queries: 1
      timescape_readwrite_role/skip_unavailable_shards: 1
      # disable the query profiler due to us hitting https://github.com/ClickHouse/ClickHouse/issues/15638 on some arm64 hosts
      timescape_readwrite_role/query_profiler_cpu_time_period_ns: "0"
      timescape_readwrite_role/query_profiler_real_time_period_ns: "0"
      timescape_readwrite_role/prefer_global_in_and_join: 1
      timescape_readonly_role/readonly: 2   # allow read queries only (SELECT, SHOW, DESCRIBE, EXISTS) and SET SETTINGS
      timescape_readonly_role/allow_ddl: 0  # disallow DDL queries    (CREATE, ALTER, RENAME, ATTACH, DETACH, DROP, TRUNCATE)
      timescape_readonly_role/log_queries: 1
      timescape_readonly_role/skip_unavailable_shards: 1
      # disable the query profiler due to us hitting https://github.com/ClickHouse/ClickHouse/issues/15638 on some arm64 hosts
      timescape_readonly_role/query_profiler_cpu_time_period_ns: "0"
      timescape_readonly_role/query_profiler_real_time_period_ns: "0"
      timescape_readonly_role/prefer_global_in_and_join: 1
      timescape_trimmer_role/readonly: 0      # allow all queries       (SELECT, SHOW, DESCRIBE, EXISTS, INSERT, OPTIMIZE, SET, USE)
      timescape_trimmer_role/allow_ddl: 1     # allow DDL queries       (CREATE, ALTER, RENAME, ATTACH, DETACH, DROP, TRUNCATE)
      timescape_trimmer_role/log_queries: 1
      timescape_trimmer_role/skip_unavailable_shards: 1
      timescape_trimmer_role/prefer_global_in_and_join: 1
      # disable the query profiler due to us hitting https://github.com/ClickHouse/ClickHouse/issues/15638 on some arm64 hosts
      timescape_trimmer_role/query_profiler_cpu_time_period_ns: "0"
      timescape_trimmer_role/query_profiler_real_time_period_ns: "0"
    users:
      timescape_migrate/k8s_secret_password: default/hubble-timescape-migrate-creds/CLICKHOUSE_PASSWORD
      timescape_migrate/profile: timescape_admin_role
      timescape_migrate/grants/query:
        - "REVOKE ALL ON *.*"
        - "GRANT timescape_admin_role"
      timescape_migrate/quota: default
      timescape_migrate/networks/ip:
        - "::/0"
      timescape_ingester/k8s_secret_password: default/hubble-timescape-ingester-creds/CLICKHOUSE_PASSWORD
      timescape_ingester/profile: timescape_readwrite_role
      timescape_ingester/grants/query:
        - "REVOKE ALL ON *.*"
        - "GRANT timescape_readwrite_role"
      timescape_ingester/quota: default
      timescape_ingester/networks/ip:
        - "::/0"
      timescape_trimmer/k8s_secret_password: default/hubble-timescape-trimmer-creds/CLICKHOUSE_PASSWORD
      timescape_trimmer/profile: timescape_trimmer_role
      timescape_trimmer/grants/query:
        - "REVOKE ALL ON *.*"
        - "GRANT timescape_trimmer_role"
      timescape_trimmer/quota: default
      timescape_trimmer/networks/ip:
        - "::/0"
      timescape_server/k8s_secret_password: default/hubble-timescape-server-creds/CLICKHOUSE_PASSWORD
      timescape_server/profile: timescape_readwrite_role
      timescape_server/grants/query:
        - "REVOKE ALL ON *.*"
        - "GRANT timescape_readwrite_role"
      timescape_server/quota: default
      timescape_server/networks/ip:
        - "::/0"
      timescape_analyzer/k8s_secret_password: default/hubble-timescape-analyzer-creds/CLICKHOUSE_PASSWORD
      timescape_analyzer/profile: timescape_readwrite_role
      timescape_analyzer/grants/query:
        - "REVOKE ALL ON *.*"
        - "GRANT timescape_readwrite_role"
      timescape_analyzer/quota: default
      timescape_analyzer/networks/ip:
        - "::/0"
      timescape_table_metrics/k8s_secret_password: default/hubble-timescape-table-metrics-creds/CLICKHOUSE_PASSWORD
      timescape_table_metrics/profile: timescape_readonly_role
      timescape_table_metrics/grants/query:
        - "REVOKE ALL ON *.*"
        - "GRANT timescape_readonly_role"
        - "GRANT SELECT on system.parts"
        - "GRANT SHOW on system.*"
      timescape_table_metrics/quota: default
      timescape_table_metrics/networks/ip:
        - "::/0"
  templates:
    podTemplates:
    - name: pod-template
      metadata:
        labels:
          # clickhouse-operator will also add its own set of labels
          app.kubernetes.io/name: hubble-timescape-clickhouse
          app.kubernetes.io/instance: hubble-timescape-clickhouse-release-name
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: hubble-timescape
      spec:
        priorityClassName: 
        affinity:
          podAntiAffinity:
            # never schedule on a node running Timescape Lite with clickhouse to prevent accidentally mounting a PV twice
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                - key: hubble-timescape-lite-clickhouse
                  operator: Exists
              topologyKey: kubernetes.io/hostname
        containers:
          - name: clickhouse
            image: "quay.io/isovalent/clickhouse-server:25.8.11.66-alpine@sha256:32a477a44e92a37347e6df7684a1e6cce01f5af73d356e03ca13383da0bdf8b3"
            imagePullPolicy: IfNotPresent
            terminationMessagePolicy: FallbackToLogsOnError
            resources:
              {}
            volumeMounts:
              - name: data-storage-template
                mountPath: /var/lib/clickhouse
              - name: tls
                mountPath: "/etc/clickhouse-server/tls"
                readOnly: true
              - name: client-config
                mountPath: "/etc/clickhouse-client/"
                readOnly: true
            env:
            readinessProbe:
              httpGet:
                path: /ping
                port: https
                scheme: HTTPS
            livenessProbe:
              httpGet:
                path: /ping
                port: https
                scheme: HTTPS
              initialDelaySeconds: 60
              periodSeconds: 3
            ports:
            - containerPort: 9440
              name: tcp
              protocol: TCP
            - containerPort: 8443
              name: https
              protocol: TCP
            - containerPort: 9009
              name: interserver
              protocol: TCP
            - containerPort: 8001
              name: metrics
              protocol: TCP
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              runAsGroup: 101
              runAsNonRoot: true
              runAsUser: 101
              seccompProfile:
                type: RuntimeDefault
        securityContext:
          fsGroup: 101
          seccompProfile:
            type: RuntimeDefault
        volumes:
        - name: tls
          projected:
            # need group read permissions so fsGroup can read the files
            defaultMode: 0440
            sources:
            - secret:
                items:
                - key: tls.crt
                  path: tls.crt
                - key: tls.key
                  path: tls.key
                name: hubble-timescape-clickhouse-cert
        - name: client-config
          projected:
            defaultMode: 0400
            sources:
            - configMap:
                items:
                - key: config.xml
                  path: config.xml
                name: hubble-timescape-clickhouse-client-config
    serviceTemplates:
      - name: svc-template
        generateName: "clickhouse-{chi}"
        metadata:
          labels:
            # clickhouse-operator will also add its own set of labels
            metrics-service: 'true'
            helm.sh/chart: hubble-timescape-0.0.0
            app.kubernetes.io/name: hubble-timescape-clickhouse
            app.kubernetes.io/instance: hubble-timescape-clickhouse-release-name
            app.kubernetes.io/component: database
            app.kubernetes.io/part-of: hubble-timescape
            app.kubernetes.io/version: "0.0.0"
            app.kubernetes.io/managed-by: Helm
        spec:
          ports:
            - name: https
              port: 8443
            - name: tcp
              port: 9440
            - name: metrics
              port: 8001
          type: ClusterIP  # Avoid exposing the ClickHouse installation to outside.
    volumeClaimTemplates:
    - name: data-storage-template
      reclaimPolicy: Retain
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Ti
        storageClassName:
---
# Source: hubble-timescape/templates/clickhouse_cluster_servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hubble-timescape-clickhouse-hubble-data
  namespace: default
  labels:
    helm.sh/chart: hubble-timescape-0.0.0
    app.kubernetes.io/name: hubble-timescape-clickhouse
    app.kubernetes.io/instance: hubble-timescape-clickhouse-release-name
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: hubble-timescape
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      metrics-service: 'true'
      helm.sh/chart: hubble-timescape-0.0.0
      app.kubernetes.io/name: hubble-timescape-clickhouse
      app.kubernetes.io/instance: hubble-timescape-clickhouse-release-name
      app.kubernetes.io/component: database
      app.kubernetes.io/part-of: hubble-timescape
      app.kubernetes.io/version: "0.0.0"
      app.kubernetes.io/managed-by: Helm
  namespaceSelector:
    matchNames:
    - default
  endpoints:
  - port: metrics
    interval: 30s
    honorLabels: true
    path: /metrics
  - port: https
    scheme: https
    basicAuth:
      username:
        name: hubble-timescape-table-metrics-creds
        key: CLICKHOUSE_USERNAME
      password:
        name: hubble-timescape-table-metrics-creds
        key: CLICKHOUSE_PASSWORD
    tlsConfig:
      serverName: clickhouse-hubble-timescape
    interval: 15s
    honorLabels: true
    # see config.d/tablemetrics.xml where we define custom http_handlers
    path: /isovalent/metrics/table
