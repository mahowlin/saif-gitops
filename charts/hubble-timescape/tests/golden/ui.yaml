# Source: hubble-timescape/templates/clickhouse_installation_altinity.yaml
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: "hubble-timescape"
  namespace: default
  labels:
    # clickhouse-operator will also add its own set of labels
    helm.sh/chart: hubble-timescape-0.0.0
    app.kubernetes.io/name: hubble-timescape-clickhouse
    app.kubernetes.io/instance: hubble-timescape-clickhouse-release-name
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: hubble-timescape
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  defaults:
    templates:
      podTemplate: pod-template
      serviceTemplate: svc-template
  configuration:
    files:
      config.d/tablemetrics.xml: |-
        <clickhouse>
          <http_handlers>
            <rule>
              <url>/isovalent/metrics/table</url>
              <methods>GET</methods>
              <handler>
                <type>predefined_query_handler</type>
                <query>
                  
                  SELECT
                    'clickhouse_system_parts_rows' as name,
                    sum(rows) as value,
                    map('database', database, 'table', table) as labels,
                    'gauge' as type,
                    'Total number of rows' as help
                  FROM system.parts
                  WHERE active
                  GROUP BY
                    database,
                    table
                  ORDER BY
                    database,
                    table
                  
                  UNION ALL
                  
                  SELECT
                    'clickhouse_system_parts_total_size' as name,
                    sum(bytes) as value,
                    map('database', database, 'table', table) as labels,
                    'gauge' as type,
                    'Total table size in bytes' as help
                  FROM system.parts
                  WHERE active
                  GROUP BY
                    database,
                    table
                  ORDER BY
                    database,
                    table
                  
                  UNION ALL
                  
                  SELECT
                    'clickhouse_system_parts_largest_size' as name,
                    max(bytes) as value,
                    map('database', database, 'table', table) as labels,
                    'gauge' as type,
                    'Size of the largest part in bytes' as help
                  FROM system.parts
                  WHERE active
                  GROUP BY
                    database,
                    table
                  ORDER BY
                    database,
                    table
                  
                  UNION ALL
                  
                  SELECT
                    'clickhouse_system_parts_primary_keys_size' as name,
                    sum(primary_key_bytes_in_memory) as value,
                    map('database', database, 'table', table) as labels,
                    'gauge' as type,
                    'Total size of the primary keys in bytes' as help
                  FROM system.parts
                  WHERE active
                  GROUP BY
                    database,
                    table
                  ORDER BY
                    database,
                    table
                  
                  UNION ALL
                  
                  SELECT
                    'clickhouse_system_parts_count' as name,
                    count(*) as value,
                    map('database', database, 'table', table, 'state', multiIf(active, 'active', 'inactive')) as labels,
                    'gauge' as type,
                    'Total number of parts' as help
                  FROM system.parts
                  GROUP BY
                    database,
                    table,
                    active
                  ORDER BY
                    database,
                    table,
                    active
                  
                  FORMAT Prometheus
                </query>
              </handler>
            </rule>
            <!-- keep the default handlers such as query, play, ping -->
            <defaults/>
          </http_handlers>
        </clickhouse>
      users.d/timescape_roles.xml: |-
        <clickhouse>
          <roles>
            <timescape_admin_role>
              <grants>
                <!-- Migrate needs to be able to create, update, delete and modify tables as well as create the database to use. -->
                <query>
                  GRANT CREATE DATABASE,DROP DATABASE,
                  CREATE TABLE,DROP TABLE,
                  CREATE VIEW,DROP VIEW,
                  CREATE DICTIONARY,DROP DICTIONARY,
                  ALTER,
                  SELECT,INSERT,TRUNCATE,OPTIMIZE,SHOW
                  ON hubble.*
                </query>
                <!--
                GRANT remote is globally scoped and cannot be done on a DB level, which is why ON specifies *.*
                Additionally, we do not include WITH REPLACE OPTION, since this appends to the grants done previously.
                -->
                <query>GRANT REMOTE ON *.* </query>
                <!--
                Newer versions of clickhouse (eg: 24.3 LTS) now requires permissions to access system tables.
                https://github.com/ClickHouse/ClickHouse/pull/38970
                -->
                <query>GRANT SELECT ON system.*</query>
              </grants>
            </timescape_admin_role>
            <timescape_trimmer_role>
              <grants>
                <!-- Trimmer needs SELECT to query for events, and ALTER DELETE to remove events. -->
                <query>GRANT SELECT,ALTER DELETE ON hubble.*</query>
                <query>GRANT SELECT ON system.mutations</query>
              </grants>
            </timescape_trimmer_role>
            <timescape_readwrite_role>
              <grants>
                <!-- Ingester needs SELECT to read from the ingestion log and INSERT to write into tables. -->
                <query>GRANT SELECT,INSERT ON hubble.*</query>
              </grants>
            </timescape_readwrite_role>
            <timescape_readonly_role>
              <grants>
                <!-- Server only needs SELECT to query events -->
                <query>GRANT SELECT ON hubble.*</query>
              </grants>
            </timescape_readonly_role>
          </roles>
        </clickhouse>
    clusters:
    - name: "hubble-data"
      layout:
        shardsCount: 1
      secure: "True"
      insecure: "False"
      secret:
        auto: "True"
    settings:
      logger/level: information
      max_concurrent_queries: 100
      max_connections: 4096
      merge_tree/max_suspicious_broken_parts: 500
      asynchronous_insert_log/engine: _removed_
      asynchronous_insert_log/ttl: event_time + INTERVAL 2 day
      asynchronous_metric_log/engine: _removed_
      asynchronous_metric_log/ttl: event_time + INTERVAL 2 day
