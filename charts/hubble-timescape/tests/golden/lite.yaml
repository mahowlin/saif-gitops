data:
  config.yaml: |
    log-level: info
    prometheus-serve-addr: ":9090"
    pprof: true
    pprof-address: "localhost"
    pprof-port: "6060"
    gops: true
    gops-port: "9898"
    connection-logs-ttl: 1h0m0s
    connection-logs-hourly-rollup-age: 
    connection-logs-daily-rollup-age: 
    flows-ttl: 1h0m0s
    k8s-ttl: 1h0m0s
    assessment-reports-ttl:  730h0m0s
    system-status-ttl:  24h
    clickhouse-storage-mode: ""
    enable-clickhouse-server-logs: "false"
    log-query-progress: "false"
    enable-analyzer: true
    health-listen-address: ":8083"
    enable-ui: true
    enable-tracing: false
    log-traces: false
    sampling:
      spanMatcherSampler:
        matchers: []
    otlp-enabled: false
    otlp-endpoint: 
    otlp-transport: "grpc"
    otlp-secure: "true"
    otlp-url-path: 
    server:
      listen-address: :4244
      enable-tls: true
      tls-cert-file: /var/lib/hubble-timescape/tls/server.crt
      tls-key-file: /var/lib/hubble-timescape/tls/server.key
      tls-require-client-cert: false
      enable-experimental-api: false
      query-cache-disabled: true
      rbac:
        enabled: true
        auth-types: oidc
        oidc-issuer-url: https://dex.172-18-0-2.sslip.io
        oidc-issuer-ca: /var/lib/hubble-timescape/tls/oidc-provider-ca.pem
        oidc-client-ids: hubble,grafana
        policy-mode: config
        policy-file: /etc/timescape-rbac/policy/hubble-timescape-rbac-policy.yaml
        policy-log-roles: true
    ingester:
      batch-size: 10000
      list-objects-timeout: 1m
      list-objects-max-lookback: 
      bucket-uri: ""
      buckets: 
        []
      bucket-pattern: ""
      cluster-name: ""
      enable-flows-ingestion: true
      flows-pattern: 
      enable-k8s-events-ingestion: true
      k8s-pattern: 
      enable-system-status-ingestion: true
      system-status-pattern: 
      enable-connection-logs-ingestion: true
      connection-logs-pattern: 
      report-interval: 1s
      schedule-interval: 5m
      delete-after-ingest: 
      max-allowed-ingest-errors: "3"
      enable-push-api: true
      push-api-tls-enabled: true
      push-api-tls-cert-file: /var/lib/hubble-timescape/tls/push-server.crt
      push-api-tls-key-file: /var/lib/hubble-timescape/tls/push-server.key
      push-api-tls-client-ca-files: /var/lib/hubble-timescape/tls/push-server-client-ca.crt
      enable-stream-api: true
      stream-api-flush-interval: "5s"
      stream-api-tls-enabled: true
      stream-api-tls-cert-file: /var/lib/hubble-timescape/tls/push-server.crt
      stream-api-tls-key-file: /var/lib/hubble-timescape/tls/push-server.key
      stream-api-tls-client-ca-files: /var/lib/hubble-timescape/tls/push-server-client-ca.crt
      enable-k8s-importer: true
      k8s-importer-cluster-name: "my-cluster"
      k8s-importer-flush-interval: "5s"
      k8s-importer-cilium-network-policies: "true"
      k8s-importer-k8s-network-policies: "true"
      k8s-importer-k8s-endpoints: "true"
      k8s-importer-cilium-endpoints: "true"
      k8s-importer-cilium-identities: "true"
      k8s-importer-tetragon-network-policies: "true"
      k8s-importer-cilium-nodes: "true"
      k8s-importer-tetragon-nodes: "true"
      k8s-importer-smart-switches: "true"
      k8s-importer-smart-switch-network-policies: "true"
      async-insert-disabled: "false"
      async-insert-busy-timeout: 2s
      async-insert-max-data-size: 104857600
      filter-batch-size: 100
      filter-batch-window: 10s
      disable-default-ingest-patterns: false
      disable-file-must-match-ingest-pattern: false
    trimmer:
      flows-count: 
      timeout: 60m
    analyzer:
      schedule-interval: 24h
    ui:
      http-address: ":8000"
      timescape-address: localhost:4244
      timescape-enable-tls: true
      timescape-ca-files: /var/lib/hubble-timescape-ui/tls/ca.crt
      observability:
        flows:
          enabled: true
        connections:
          enabled: false
        topology:
          enabled: false
        explorer:
          enabled: false
      network-security:
        assessment:
          enabled: false
          analyzer:
            enabled: true
        policies:
          enabled: true
        enforcement-points:
          enabled: false
      health:
        system-status:
          enabled: false
      load-balancing:
        enabled: true
      oauth2:
        enabled: true
        oidc:
          client-id: hubble,grafana
          client-assertion-type: 
          client-assertion-file: 
          issuer-url: https://dex.172-18-0-2.sslip.io
          redirect-url: https://hubble-timescape-ui.example.com/oauth2/callback
          scopes:
            - openid
            - email
            - offline_access
          issuer-ca: /var/lib/hubble-timescape-ui/tls/oidc-provider-ca.pem
          id-token-user-claim: "email"
