# Source: hubble-timescape/templates/server_rbac_policy_configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    helm.sh/chart: hubble-timescape-0.0.0
    app.kubernetes.io/name: hubble-timescape-lite
    app.kubernetes.io/instance: hubble-timescape-lite-release-name
    app.kubernetes.io/component: lite
    app.kubernetes.io/part-of: hubble-timescape
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  name: hubble-timescape-rbac-policy
  namespace: default
data:
  hubble-timescape-rbac-policy.yaml: |
    roles: 
      - name: demos
        rules:
        - actions:
          - get
          contexts:
          - field: namespace
            values:
            - kube-system
            - tenant-jobs
          kind: flows
      - name: admin
        rules:
        - actions:
          - '*'
          allowAllContexts: true
          kind: '*'
    bindings: 
      - role: admin
        scope: hubble-rbac
        value: Everyone
      - role: admin
        scope: email
        value: admin@example.com
      - role: demos
        scope: email
        value: demo@example.com
