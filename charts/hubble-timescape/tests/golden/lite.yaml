    app.kubernetes.io/name: hubble-timescape-lite
    app.kubernetes.io/instance: hubble-timescape-lite-release-name
    app.kubernetes.io/component: lite
    app.kubernetes.io/part-of: hubble-timescape
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
spec:
  groups:
    - name: HubbleTimescapeServer
      rules:
        - alert: 'TimescapeQueriesFailureRateHigh'
          # Alert when >10% of queries are failing.
          expr: |
            sum(rate(timescape_clickhouse_queries_duration_seconds_count{status="error",namespace="default"}[10m])) by (namespace, cluster)
            /
            sum(rate(timescape_clickhouse_queries_duration_seconds_count{namespace="default"}[10m])) by (namespace, cluster) > 0.1
          labels:
            severity: warning
          annotations:
            summary: 'Hubble Timescape queries failure rate is high'
            description:  'Hubble Timescape queries failure rate is {{ printf "%.2f" $value }}.'
