# Source: hubble-timescape/templates/lite_clickhouse_configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-timescape-lite-clickhouse-settings
  namespace: default
  labels:
    helm.sh/chart: hubble-timescape-0.0.0
    app.kubernetes.io/name: hubble-timescape-lite
    app.kubernetes.io/instance: hubble-timescape-lite-release-name
    app.kubernetes.io/component: lite
    app.kubernetes.io/part-of: hubble-timescape
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  clickhouse-users.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
      <users>
        <!-- Remove default user -->
        <default remove="remove">
        </default>

        <timescape_lite>
          <networks>
            <ip>::1</ip>
            <ip>127.0.0.1</ip>
          </networks>
          <profile>timescape_lite</profile>
          <quota>default</quota>
          <password></password>
        </timescape_lite>
        <tablemetrics>
          <networks>
            <!-- we need to allow connections from all interfaces to allow prometheus to scrape metrics using the http api -->
            <ip>::/0</ip>
          </networks>
          <profile>tablemetrics</profile>
          <quota>default</quota>
          <password></password>
          <grants>
            <query>REVOKE ALL ON *.*</query>
            <query>GRANT SELECT on hubble.*</query>
            <query>GRANT SELECT on system.parts</query>
            <query>GRANT SHOW on system.*</query>
          </grants>
        </tablemetrics>
      </users>
    </clickhouse>
  clickhouse-profiles.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
      <profiles>
        <timescape_lite>
          <allow_ddl>1</allow_ddl>
          <log_queries>1</log_queries>
          <prefer_global_in_and_join>1</prefer_global_in_and_join>
          <query_profiler_cpu_time_period_ns>0</query_profiler_cpu_time_period_ns>
          <query_profiler_real_time_period_ns>0</query_profiler_real_time_period_ns>
          <readonly>0</readonly>
          <skip_unavailable_shards>1</skip_unavailable_shards>
        </timescape_lite>
        <tablemetrics>
          <allow_ddl>0</allow_ddl>
          <log_queries>1</log_queries>
          <prefer_global_in_and_join>1</prefer_global_in_and_join>
          <query_profiler_cpu_time_period_ns>0</query_profiler_cpu_time_period_ns>
          <query_profiler_real_time_period_ns>0</query_profiler_real_time_period_ns>
          <readonly>2</readonly>
          <skip_unavailable_shards>1</skip_unavailable_shards>
        </tablemetrics>
      </profiles>
    </clickhouse>
  clickhouse-settings.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
      <!-- Listen wildcard address to allow accepting connections from other containers and host network. -->
      <listen_host>::</listen_host>
      <listen_host>0.0.0.0</listen_host>
      <listen_try>1</listen_try>
      <!-- see https://clickhouse.com/docs/en/operations/server-configuration-parameters/settings/#max-table-size-to-drop -->
      <max_table_size_to_drop>0</max_table_size_to_drop>
      <max_concurrent_queries>100</max_concurrent_queries>
      <max_connections>4096</max_connections>
      <merge_tree>
        <max_suspicious_broken_parts>500</max_suspicious_broken_parts>
      </merge_tree>
      <asynchronous_insert_log replace="1">
        <ttl>event_time + INTERVAL 2 hour</ttl>
      </asynchronous_insert_log>
      <asynchronous_metric_log replace="1">
        <ttl>event_time + INTERVAL 2 hour</ttl>
      </asynchronous_metric_log>
      <backup_log replace="1">
        <ttl>event_time + INTERVAL 1 year</ttl>
      </backup_log>
      <blob_storage_log replace="1">
        <ttl>event_time + INTERVAL 2 hour</ttl>
      </blob_storage_log>
      <crash_log replace="1">
        <ttl>event_time + INTERVAL 1 year</ttl>
      </crash_log>
      <error_log replace="1">
        <ttl>event_time + INTERVAL 2 month</ttl>
      </error_log>
      <metric_log replace="1">
        <ttl>event_time + INTERVAL 2 hour</ttl>
      </metric_log>
      <opentelemetry_span_log replace="1">
        <ttl>fromUnixTimestamp64Micro(finish_time_us) + INTERVAL 2 hour</ttl>
      </opentelemetry_span_log>
      <part_log replace="1">
        <ttl>event_time + INTERVAL 2 hour</ttl>
      </part_log>
      <processors_profile_log replace="1">
        <ttl>event_time + INTERVAL 2 hour</ttl>
      </processors_profile_log>
      <query_log replace="1">
        <ttl>event_time + INTERVAL 2 hour</ttl>
      </query_log>
      <query_metric_log replace="1">
        <ttl>event_time + INTERVAL 2 hour</ttl>
      </query_metric_log>
      <query_thread_log replace="1">
        <ttl>event_time + INTERVAL 2 hour</ttl>
      </query_thread_log>
      <query_views_log replace="1">
        <ttl>event_time + INTERVAL 2 hour</ttl>
      </query_views_log>
      <session_log replace="1">
        <ttl>event_time + INTERVAL 2 hour</ttl>
      </session_log>
      <text_log replace="1">
        <ttl>event_time + INTERVAL 2 hour</ttl>
      </text_log>
      <trace_log replace="1">
        <ttl>event_time + INTERVAL 2 hour</ttl>
      </trace_log>
      <zookeeper_log replace="1">
        <ttl>event_time + INTERVAL 2 hour</ttl>
      </zookeeper_log>
      <logger>
        <console>true</console>
        <level>information</level>
      </logger>
      <prometheus>
        <asynchronous_metrics>true</asynchronous_metrics>
        <endpoint>/metrics</endpoint>
        <events>true</events>
        <metrics>true</metrics>
        <port>8001</port>
      </prometheus>
      <postgresql_port remove="1"></postgresql_port>
      <mysql_port remove="1"></mysql_port>
      <!-- we're always running with a single replica, no point in opening it -->
      <interserver_http_port remove="1"></interserver_http_port>
      <http_handlers>
        <rule>
          <url>/isovalent/metrics/table</url>
          <methods>GET</methods>
          <handler>
            <type>predefined_query_handler</type>
            <query>
              
              SELECT
                'clickhouse_system_parts_rows' as name,
                sum(rows) as value,
                map('database', database, 'table', table) as labels,
                'gauge' as type,
                'Total number of rows' as help
              FROM system.parts
              WHERE active
              GROUP BY
                database,
                table
              ORDER BY
                database,
                table
              
              UNION ALL
              
              SELECT
                'clickhouse_system_parts_total_size' as name,
                sum(bytes) as value,
                map('database', database, 'table', table) as labels,
                'gauge' as type,
                'Total table size in bytes' as help
              FROM system.parts
              WHERE active
              GROUP BY
                database,
                table
              ORDER BY
                database,
                table
              
              UNION ALL
              
              SELECT
                'clickhouse_system_parts_largest_size' as name,
                max(bytes) as value,
                map('database', database, 'table', table) as labels,
                'gauge' as type,
                'Size of the largest part in bytes' as help
              FROM system.parts
              WHERE active
              GROUP BY
                database,
                table
              ORDER BY
                database,
                table
              
              UNION ALL
              
              SELECT
                'clickhouse_system_parts_primary_keys_size' as name,
                sum(primary_key_bytes_in_memory) as value,
                map('database', database, 'table', table) as labels,
                'gauge' as type,
                'Total size of the primary keys in bytes' as help
              FROM system.parts
              WHERE active
              GROUP BY
                database,
                table
              ORDER BY
                database,
                table
              
              UNION ALL
              
              SELECT
                'clickhouse_system_parts_count' as name,
                count(*) as value,
                map('database', database, 'table', table, 'state', multiIf(active, 'active', 'inactive')) as labels,
                'gauge' as type,
                'Total number of parts' as help
              FROM system.parts
              GROUP BY
                database,
                table,
                active
              ORDER BY
                database,
                table,
                active
              
              FORMAT Prometheus
            </query>
          </handler>
        </rule>
        <!-- keep the default handlers such as query, play, ping -->
        <defaults/>
      </http_handlers>
    </clickhouse>
