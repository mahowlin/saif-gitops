spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hubble-timescape-analyzer
      app.kubernetes.io/instance: hubble-timescape-analyzer-release-name
      app.kubernetes.io/component: analyzer
      app.kubernetes.io/part-of: hubble-timescape
  template:
    metadata:
      annotations:
        hubble-timescape-analyzer-configmap-checksum: "3d766ebd335d72fa1b39fb23e9e16388019ee1aa184bc566dec55bdf816002fa"
      labels:
        app.kubernetes.io/name: hubble-timescape-analyzer
        app.kubernetes.io/instance: hubble-timescape-analyzer-release-name
        app.kubernetes.io/component: analyzer
        app.kubernetes.io/part-of: hubble-timescape
    spec:
      serviceAccountName: "hubble-timescape-analyzer"
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: 
      containers:
        - name: analyzer
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          image: "quay.io/isovalent/hubble-timescape:v1.18.1"
          imagePullPolicy: IfNotPresent
          terminationMessagePolicy: FallbackToLogsOnError
          command:
            - /usr/bin/hubble-timescape
          args:
            - analyze
          env:
            - name: HUBBLE_TIMESCAPE_CLICKHOUSE_USERNAME
              value: "timescape_analyzer"
            - name: HUBBLE_TIMESCAPE_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hubble-timescape-analyzer-creds
                  key: CLICKHOUSE_PASSWORD
            - name: HUBBLE_TIMESCAPE_DSN
              value: "clickhouse://clickhouse-hubble-timescape:9000/hubble?dial_timeout=10s"
            - name: FOO
              value: BAR
          ports:
            - name: analyze-health
              containerPort: 8081
              protocol: TCP
            - name: analyze-metrics
              containerPort: 9090
              protocol: TCP
            - name: analyze-pprof
              containerPort: 6060
              protocol: TCP
          startupProbe:
            grpc:
              port: 8081
        
            # The Timescape analyzer implement a retry logic to connect to
            # ClickHouse with a timeout of 10s retrying 30 times before giving
