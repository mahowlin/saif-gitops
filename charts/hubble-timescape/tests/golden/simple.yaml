# Source: hubble-timescape/templates/ui_route.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-timescape-ui
  namespace: default
  labels:
    helm.sh/chart: hubble-timescape-0.0.0
    app.kubernetes.io/name: hubble-timescape-ui
    app.kubernetes.io/instance: hubble-timescape-ui-release-name
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: hubble-timescape
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - kind: Gateway
      name: hubble-timescape-ui-gateway
      namespace: hubble-timescape
  hostnames:
    - hubble-timescape-ui.example.com
  rules:
    - backendRefs:
        - name: hubble-timescape-ui
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
---
# Source: hubble-timescape/templates/clickhouse_cluster_servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hubble-timescape-clickhouse-hubble-data
  namespace: default
  labels:
    helm.sh/chart: hubble-timescape-0.0.0
    app.kubernetes.io/name: hubble-timescape-clickhouse
    app.kubernetes.io/instance: hubble-timescape-clickhouse-release-name
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: hubble-timescape
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      metrics-service: 'true'
      helm.sh/chart: hubble-timescape-0.0.0
      app.kubernetes.io/name: hubble-timescape-clickhouse
      app.kubernetes.io/instance: hubble-timescape-clickhouse-release-name
      app.kubernetes.io/component: database
      app.kubernetes.io/part-of: hubble-timescape
      app.kubernetes.io/version: "0.0.0"
      app.kubernetes.io/managed-by: Helm
  namespaceSelector:
    matchNames:
    - default
  endpoints:
  - port: metrics
    interval: 30s
    honorLabels: true
    path: /metrics
  - port: http
    scheme: http
    basicAuth:
      username:
        name: hubble-timescape-table-metrics-creds
        key: CLICKHOUSE_USERNAME
      password:
        name: hubble-timescape-table-metrics-creds
        key: CLICKHOUSE_PASSWORD
    tlsConfig:
      serverName: clickhouse-hubble-timescape
    interval: 15s
    honorLabels: true
    # see config.d/tablemetrics.xml where we define custom http_handlers
    path: /isovalent/metrics/table
