# Source: hubble-timescape/templates/clickhouse_installation_altinity.yaml
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: "hubble-timescape"
  namespace: default
  labels:
    # clickhouse-operator will also add its own set of labels
    helm.sh/chart: hubble-timescape-0.0.0
    app.kubernetes.io/name: hubble-timescape-clickhouse
    app.kubernetes.io/instance: hubble-timescape-clickhouse-release-name
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: hubble-timescape
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  defaults:
    templates:
      podTemplate: pod-template
      serviceTemplate: svc-template
  configuration:
    files:
      config.d/tablemetrics.xml: |-
        <clickhouse>
          <http_handlers>
            <rule>
              <url>/isovalent/metrics/table</url>
              <methods>GET</methods>
              <handler>
                <type>predefined_query_handler</type>
                <query>
                  
                  SELECT
                    'clickhouse_system_parts_rows' as name,
                    sum(rows) as value,
                    map('database', database, 'table', table) as labels,
                    'gauge' as type,
                    'Total number of rows' as help
                  FROM system.parts
                  WHERE active
                  GROUP BY
                    database,
                    table
                  ORDER BY
                    database,
                    table
                  
                  UNION ALL
                  
                  SELECT
                    'clickhouse_system_parts_total_size' as name,
                    sum(bytes) as value,
                    map('database', database, 'table', table) as labels,
                    'gauge' as type,
                    'Total table size in bytes' as help
                  FROM system.parts
                  WHERE active
                  GROUP BY
                    database,
                    table
                  ORDER BY
                    database,
                    table
                  
                  UNION ALL
                  
                  SELECT
                    'clickhouse_system_parts_largest_size' as name,
                    max(bytes) as value,
                    map('database', database, 'table', table) as labels,
                    'gauge' as type,
                    'Size of the largest part in bytes' as help
                  FROM system.parts
                  WHERE active
                  GROUP BY
                    database,
                    table
                  ORDER BY
                    database,
                    table
                  
                  UNION ALL
                  
                  SELECT
                    'clickhouse_system_parts_primary_keys_size' as name,
                    sum(primary_key_bytes_in_memory) as value,
                    map('database', database, 'table', table) as labels,
                    'gauge' as type,
                    'Total size of the primary keys in bytes' as help
                  FROM system.parts
                  WHERE active
                  GROUP BY
                    database,
                    table
                  ORDER BY
                    database,
                    table
                  
                  UNION ALL
                  
                  SELECT
                    'clickhouse_system_parts_count' as name,
                    count(*) as value,
                    map('database', database, 'table', table, 'state', multiIf(active, 'active', 'inactive')) as labels,
                    'gauge' as type,
                    'Total number of parts' as help
                  FROM system.parts
                  GROUP BY
                    database,
                    table,
                    active
                  ORDER BY
                    database,
                    table,
                    active
                  
                  FORMAT Prometheus
                </query>
              </handler>
            </rule>
            <!-- keep the default handlers such as query, play, ping -->
            <defaults/>
          </http_handlers>
        </clickhouse>
      users.d/timescape_roles.xml: |-
        <clickhouse>
          <roles>
            <timescape_admin_role>
              <grants>
                <!-- Migrate needs to be able to create, update, delete and modify tables as well as create the database to use. -->
                <query>
                  GRANT CREATE DATABASE,DROP DATABASE,
                  CREATE TABLE,DROP TABLE,
                  CREATE VIEW,DROP VIEW,
                  CREATE DICTIONARY,DROP DICTIONARY,
                  ALTER,
                  SELECT,INSERT,TRUNCATE,OPTIMIZE,SHOW
                  ON hubble.*
                </query>
                <!--
                GRANT remote is globally scoped and cannot be done on a DB level, which is why ON specifies *.*
                Additionally, we do not include WITH REPLACE OPTION, since this appends to the grants done previously.
                -->
                <query>GRANT REMOTE ON *.* </query>
                <!--
                Newer versions of clickhouse (eg: 24.3 LTS) now requires permissions to access system tables.
                https://github.com/ClickHouse/ClickHouse/pull/38970
                -->
                <query>GRANT SELECT ON system.*</query>
              </grants>
            </timescape_admin_role>
            <timescape_trimmer_role>
              <grants>
                <!-- Trimmer needs SELECT to query for events, and ALTER DELETE to remove events. -->
                <query>GRANT SELECT,ALTER DELETE ON hubble.*</query>
                <query>GRANT SELECT ON system.mutations</query>
              </grants>
            </timescape_trimmer_role>
            <timescape_readwrite_role>
              <grants>
                <!-- Ingester needs SELECT to read from the ingestion log and INSERT to write into tables. -->
                <query>GRANT SELECT,INSERT ON hubble.*</query>
              </grants>
            </timescape_readwrite_role>
            <timescape_readonly_role>
              <grants>
                <!-- Server only needs SELECT to query events -->
                <query>GRANT SELECT ON hubble.*</query>
              </grants>
            </timescape_readonly_role>
          </roles>
        </clickhouse>
    clusters:
    - name: "hubble-data"
      layout:
        shardsCount: 1
      secure: "True"
      insecure: "False"
      secret:
        auto: "True"
    settings:
      logger/level: information
      max_concurrent_queries: 100
      max_connections: 4096
      merge_tree/max_suspicious_broken_parts: 500
      asynchronous_insert_log/engine: _removed_
      asynchronous_insert_log/ttl: event_time + INTERVAL 3 day
      asynchronous_metric_log/engine: _removed_
      asynchronous_metric_log/ttl: event_time + INTERVAL 3 day
      backup_log/engine: _removed_
      backup_log/ttl: event_time + INTERVAL 1 year
      blob_storage_log/engine: _removed_
      blob_storage_log/ttl: event_time + INTERVAL 3 day
      crash_log/engine: _removed_
      crash_log/ttl: event_time + INTERVAL 1 year
      error_log/engine: _removed_
      error_log/ttl: event_time + INTERVAL 2 month
      metric_log/engine: _removed_
      metric_log/ttl: event_time + INTERVAL 3 day
      opentelemetry_span_log/engine: _removed_
      opentelemetry_span_log/ttl: fromUnixTimestamp64Micro(finish_time_us) + INTERVAL 3 day
      part_log/engine: _removed_
      part_log/ttl: event_time + INTERVAL 3 day
      processors_profile_log/engine: _removed_
      processors_profile_log/ttl: event_time + INTERVAL 3 day
      query_log/engine: _removed_
      query_log/ttl: event_time + INTERVAL 3 day
      query_metric_log/engine: _removed_
      query_metric_log/ttl: event_time + INTERVAL 3 day
      query_thread_log/engine: _removed_
      query_thread_log/ttl: event_time + INTERVAL 3 day
      query_views_log/engine: _removed_
      query_views_log/ttl: event_time + INTERVAL 3 day
      session_log/engine: _removed_
      session_log/ttl: event_time + INTERVAL 3 day
      text_log/engine: _removed_
      text_log/ttl: event_time + INTERVAL 3 day
      trace_log/engine: _removed_
      trace_log/ttl: event_time + INTERVAL 3 day
      zookeeper_log/engine: _removed_
      zookeeper_log/ttl: event_time + INTERVAL 3 day
      max_table_size_to_drop: 0
      prometheus/endpoint: /metrics
      prometheus/port: 8001
      prometheus/metrics: true
      prometheus/events: true
      prometheus/asynchronous_metrics: true
      mysql_port: _removed_
      postgresql_port: _removed_
      # Options below are based on
      # https://github.com/Altinity/clickhouse-operator/blob/77025ca8d774b46d8381f5b45b92275d28fb2d45/tests/e2e/manifests/chi/test-033-tls.yaml
      # and https://clickhouse.com/docs/en/guides/sre/configuring-ssl/

      # enable secure ports, disable insecure ports
      tcp_port: _removed_
      tcp_port_secure: 9440
      http_port: _removed_
      https_port: 8443
      interserver_http_port: _removed_
      interserver_https_port: 9009

      # server TLS settings
      openSSL/server/certificateFile: "/etc/clickhouse-server/tls/tls.crt"
      openSSL/server/privateKeyFile: "/etc/clickhouse-server/tls/tls.key"
      openSSL/server/caConfig: "/etc/clickhouse-server/ca/ca.crt"
      openSSL/server/loadDefaultCAFile: false
      # none means we aren't requesting client certificates from clients
      openSSL/server/verificationMode: "none"
      openSSL/server/disableProtocols: "sslv2,sslv3,tlsv1,tlsv1_1,tlsv1_2"
      openSSL/server/dhParamsFile: _removed_
      openSSL/server/preferServerCiphers: false
      openSSL/server/requireTLSv1: false
      openSSL/server/requireTLSv1_1: false
      openSSL/server/requireTLSv1_2: false
      openSSL/server/requireTLSv1_3: true
      openSSL/server/cacheSessions: true

      # client TLS settings
      # custom CA
      openSSL/client/caConfig: "/etc/clickhouse-server/ca/ca.crt"
      openSSL/client/loadDefaultCAFile: false

      openSSL/client/cacheSessions: true
      openSSL/client/disableProtocols: "sslv2,sslv3,tlsv1,tlsv1_1,tlsv1_2"
      openSSL/client/preferServerCiphers: true
      # strict verifies the server cert when configured on the client
      openSSL/client/verificationMode: "strict"
      openSSL/client/invalidCertificateHandler/name: RejectCertificateHandler
    profiles:
      timescape_admin_role/readonly: 0      # allow all queries       (SELECT, SHOW, DESCRIBE, EXISTS, INSERT, OPTIMIZE, SET, USE)
      timescape_admin_role/allow_ddl: 1     # allow DDL queries       (CREATE, ALTER, RENAME, ATTACH, DETACH, DROP, TRUNCATE)
      timescape_admin_role/log_queries: 1
      timescape_admin_role/skip_unavailable_shards: 1
      timescape_admin_role/prefer_global_in_and_join: 1
      # disable the query profiler due to us hitting https://github.com/ClickHouse/ClickHouse/issues/15638 on some arm64 hosts
      timescape_admin_role/query_profiler_cpu_time_period_ns: "0"
      timescape_admin_role/query_profiler_real_time_period_ns: "0"
      timescape_readwrite_role/readonly: 0  # allow all queries       (SELECT, SHOW, DESCRIBE, EXISTS, INSERT, OPTIMIZE, SET, USE)
      timescape_readwrite_role/allow_ddl: 0 # disallow DDL queries    (CREATE, ALTER, RENAME, ATTACH, DETACH, DROP, TRUNCATE)
      timescape_readwrite_role/log_queries: 1
      timescape_readwrite_role/skip_unavailable_shards: 1
      # disable the query profiler due to us hitting https://github.com/ClickHouse/ClickHouse/issues/15638 on some arm64 hosts
      timescape_readwrite_role/query_profiler_cpu_time_period_ns: "0"
      timescape_readwrite_role/query_profiler_real_time_period_ns: "0"
      timescape_readwrite_role/prefer_global_in_and_join: 1
      timescape_readonly_role/readonly: 2   # allow read queries only (SELECT, SHOW, DESCRIBE, EXISTS) and SET SETTINGS
      timescape_readonly_role/allow_ddl: 0  # disallow DDL queries    (CREATE, ALTER, RENAME, ATTACH, DETACH, DROP, TRUNCATE)
      timescape_readonly_role/log_queries: 1
      timescape_readonly_role/skip_unavailable_shards: 1
      # disable the query profiler due to us hitting https://github.com/ClickHouse/ClickHouse/issues/15638 on some arm64 hosts
      timescape_readonly_role/query_profiler_cpu_time_period_ns: "0"
      timescape_readonly_role/query_profiler_real_time_period_ns: "0"
      timescape_readonly_role/prefer_global_in_and_join: 1
      timescape_trimmer_role/readonly: 0      # allow all queries       (SELECT, SHOW, DESCRIBE, EXISTS, INSERT, OPTIMIZE, SET, USE)
      timescape_trimmer_role/allow_ddl: 1     # allow DDL queries       (CREATE, ALTER, RENAME, ATTACH, DETACH, DROP, TRUNCATE)
      timescape_trimmer_role/log_queries: 1
      timescape_trimmer_role/skip_unavailable_shards: 1
      timescape_trimmer_role/prefer_global_in_and_join: 1
      # disable the query profiler due to us hitting https://github.com/ClickHouse/ClickHouse/issues/15638 on some arm64 hosts
      timescape_trimmer_role/query_profiler_cpu_time_period_ns: "0"
      timescape_trimmer_role/query_profiler_real_time_period_ns: "0"
    users:
      timescape_migrate/k8s_secret_password: default/custom-migrate-creds/CLICKHOUSE_PASSWORD
      timescape_migrate/profile: timescape_admin_role
      timescape_migrate/grants/query:
        - "REVOKE ALL ON *.*"
        - "GRANT timescape_admin_role"
      timescape_migrate/quota: default
      timescape_migrate/networks/ip:
        - "::/0"
      timescape_ingester/k8s_secret_password: default/custom-ingester-creds/CLICKHOUSE_PASSWORD
      timescape_ingester/profile: timescape_readwrite_role
      timescape_ingester/grants/query:
        - "REVOKE ALL ON *.*"
        - "GRANT timescape_readwrite_role"
      timescape_ingester/quota: default
      timescape_ingester/networks/ip:
        - "::/0"
      timescape_trimmer/k8s_secret_password: default/custom-trimmer-creds/CLICKHOUSE_PASSWORD
      timescape_trimmer/profile: timescape_trimmer_role
      timescape_trimmer/grants/query:
        - "REVOKE ALL ON *.*"
        - "GRANT timescape_trimmer_role"
      timescape_trimmer/quota: default
      timescape_trimmer/networks/ip:
        - "::/0"
      timescape_server/k8s_secret_password: default/custom-server-creds/CLICKHOUSE_PASSWORD
      timescape_server/profile: timescape_readwrite_role
      timescape_server/grants/query:
        - "REVOKE ALL ON *.*"
        - "GRANT timescape_readwrite_role"
      timescape_server/quota: default
      timescape_server/networks/ip:
        - "::/0"
      timescape_analyzer/k8s_secret_password: default/hubble-timescape-analyzer-creds/CLICKHOUSE_PASSWORD
      timescape_analyzer/profile: timescape_readwrite_role
      timescape_analyzer/grants/query:
        - "REVOKE ALL ON *.*"
        - "GRANT timescape_readwrite_role"
      timescape_analyzer/quota: default
      timescape_analyzer/networks/ip:
        - "::/0"
      timescape_table_metrics/k8s_secret_password: default/hubble-timescape-table-metrics-creds/CLICKHOUSE_PASSWORD
      timescape_table_metrics/profile: timescape_readonly_role
      timescape_table_metrics/grants/query:
        - "REVOKE ALL ON *.*"
        - "GRANT timescape_readonly_role"
