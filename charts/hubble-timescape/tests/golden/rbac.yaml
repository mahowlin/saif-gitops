# Source: hubble-timescape/templates/clickhouse_prometheusrules.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hubble-timescape-clickhouse
  namespace: default
  labels:
      helm.sh/chart: hubble-timescape-0.0.0
      app.kubernetes.io/name: hubble-timescape-clickhouse
      app.kubernetes.io/instance: hubble-timescape-clickhouse-release-name
      app.kubernetes.io/component: database
      app.kubernetes.io/part-of: hubble-timescape
      app.kubernetes.io/version: "0.0.0"
      app.kubernetes.io/managed-by: Helm
  annotations:
spec:
  groups:
    - name: HubbleTimescapeClickhouse
      rules:
        - alert: 'TimescapeClickhouseVolumeFillingUp'
          # Alert when <50% space left on device and it is predicted to exceed the configured threshold
          # The Alert does not fire if there is more than 50% space left to reduce false positives for newly created instances
          expr: |
            kubelet_volume_stats_available_bytes{namespace="default",persistentvolumeclaim="data-storage-template-chi-hubble-timescape-hubble-data-0-0-0"}
            /
            kubelet_volume_stats_capacity_bytes{namespace="default",persistentvolumeclaim="data-storage-template-chi-hubble-timescape-hubble-data-0-0-0"}
            < 0.5
            and
            predict_linear(kubelet_volume_stats_available_bytes{namespace="default",persistentvolumeclaim="data-storage-template-chi-hubble-timescape-hubble-data-0-0-0"}[24h], 86400)
            /
            kubelet_volume_stats_capacity_bytes{namespace="default",persistentvolumeclaim="data-storage-template-chi-hubble-timescape-hubble-data-0-0-0"}
            < 0.3
          labels:
            severity: warning
          annotations:
            summary: 'Hubble Timescape ClickHouse Volume is filling up'
            description:  |
                Based on recent sampling, the Hubble Timescape ClickHouse volume is expected to have less than {{ 0.3 | humanizePercentage }} space available within 24h.
                Currently {{ $value | humanizePercentage }} is available. Either reduce the number of exported events or increase the ClickHouse volume size to avoid ingestion issues.
            runbook_url: "https://docs.isovalent.com/operations-guide/hubble/hubble-timescape/monitoring/runbooks/clickhouse.html#timescapeclickhousevolumefillingup"
---
# Source: hubble-timescape/templates/ingester_prometheusrules.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hubble-timescape-ingester
  namespace: default
  labels:
    helm.sh/chart: hubble-timescape-0.0.0
    app.kubernetes.io/name: hubble-timescape-ingester
    app.kubernetes.io/instance: hubble-timescape-ingester-release-name
    app.kubernetes.io/component: ingester
    app.kubernetes.io/part-of: hubble-timescape
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
spec:
  groups:
    - name: HubbleTimescapeIngester
      rules:
        - alert: TimescapeIngestionDurationHigh
          # Alert when the p95 of ingest cycles is taking longer than 5 minutes
          # Any longer and it indicates that tuning is needed.
          expr: |
            histogram_quantile(0.95,
              sum(rate(timescape_ingester_ingest_duration_seconds_bucket{namespace="default"}[5m])
            ) by (le, namespace, cluster))
            # 5 minute grace period. This value needs tuning based on
            # scheduleInterval, TTL, and total flow export rate.
            > 300
          labels:
            severity: info
          annotations:
            summary: 'Hubble Timescape ingestion taking too long'
            description:  'Hubble Timescape P95 of ingestions is taking {{ $value | humanizeDuration }}'
            # Link to docs for how to handle various alerts.
            # Suggest tuning batchSize, and/or scheduleInterval.
            runbook_url: "https://docs.isovalent.com/operations-guide/features/hubble-timescape/monitoring/runbooks/ingester.html#timescapeingestiondurationhigh"
          for: '5m'

        
        - alert: TimescapeEventDataStale
          expr: |
            # "Staleness" is the difference between the current time and timestamp of the newest event
            time() -
              # Get the max timestamp value for each installation of Timescape
             max(
              # events are not processed in order, so the timestamp may go up
              # and down, so use max_over_time to get the "newest" events ingested
              # We then filter out zero values as this implies that we never ingested
              # anything for that event_type
              max_over_time(timescape_ingester_inserter_last_event_timestamp{namespace="default", event_type=~"flows"}[1h]) != 0
            ) by (namespace, cluster, event_type)
            # The gracePeriod is 3x the scheduleInterval.
            # We pick 3x instead of 2x because it accounts for if the export
            # We generally recommend an schedule interval equal to or less than
            # the export interval to minimize latency, however if they are both
            # the same, and while running, the export interval aligns with the
            # schedule interval then events might be delayed by the full
            # scheduleInterval + exportInterval which would be 2x the
            # scheduleInterval exactly, so we need some additional room for
            # delays, so we use 3x.
            > (3 * 60)
          for: '5m'
          labels:
            severity: warning
          annotations:
            summary: 'Hubble Timescape event data may be stale'
            description:  'The newest {{ $labels.event_type }} event seen is {{ humanizeDuration $value }} old which is more than 3x longer the schedule interval'
            # Link to docs for how to handle various alerts.
            runbook_url: "https://docs.isovalent.com/operations-guide/features/hubble-timescape/monitoring/runbooks/ingester.html#timescapeeventdatastale"

        
        - alert: TimescapeNotIngesting
          expr: |
            sum(rate(timescape_ingester_inserter_events_ingested_sum{namespace="default"}[3m0s])) by (namespace, cluster) == 0
          labels:
            severity: critical
          annotations:
            summary: 'Hubble Timescape has not ingested any events for 3m0s'
            description:  'Hubble Timescape ingestion rate is 0 events in 3m0s'
            # Link to docs for how to handle various alerts.
            runbook_url: "https://docs.isovalent.com/operations-guide/features/hubble-timescape/monitoring/runbooks/ingester.html#timescapenotingesting"
          for: '5m'

        - alert: TimescapeIngestionRateLow
          # 1 day ingestion rate is lower than the 75% of the 7 day rate, so
          # the last 24 hours are "atypical" if this fires
          expr: |
            sum(rate(timescape_ingester_inserter_events_ingested_sum{namespace="default"}[1d])) by (namespace, cluster) <
            sum(rate(timescape_ingester_inserter_events_ingested_sum{namespace="default"}[7d])) by (namespace, cluster) * 0.75
          labels:
            severity: info
          annotations:
            summary: 'Hubble Timescape avg ingestion rate is lower than the last 7 days'
            description:  'Hubble Timescape ingestion rate is low: {{ printf "%.1f flows/second" $value }} over 24 hours compared to the last 7 days'
            # Link to docs for how to handle various alerts.
            runbook_url: "https://docs.isovalent.com/operations-guide/features/hubble-timescape/monitoring/runbooks/ingester.html#timescapeingestionratelow"
          for: '5m'

        - alert: TimescapeIngestionRateHigh
          # 1 day ingestion rate is higher than the 125% of the 7 day rate, so
          # the last 24 hours are "atypical" if this fires
          expr: |
            sum(rate(timescape_ingester_inserter_events_ingested_sum{namespace="default"}[1d])) by (namespace, cluster) >
            sum(rate(timescape_ingester_inserter_events_ingested_sum{namespace="default"}[7d])) by (namespace, cluster) * 1.25
          labels:
            severity: info
          annotations:
            summary: 'Hubble Timescape avg ingestion rate is higher than the last 7 days'
            description:  'Hubble Timescape ingestion rate is high: {{ printf "%.1f flows/second" $value }} over 24 hours compared to the last 7 days'
            # Link to docs for how to handle various alerts.
            runbook_url: "https://docs.isovalent.com/operations-guide/features/hubble-timescape/monitoring/runbooks/ingester.html#timescapeingestionratehigh"
          for: '5m'
---
