      timescape_table_metrics/quota: default
      timescape_table_metrics/networks/ip:
        - "::/0"
  templates:
    podTemplates:
    - name: pod-template
      metadata:
        annotations:
          
          foo: bar
        labels:
          # clickhouse-operator will also add its own set of labels
          app.kubernetes.io/name: hubble-timescape-clickhouse
          app.kubernetes.io/instance: hubble-timescape-clickhouse-release-name
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: hubble-timescape
          customLabel: customValue
      spec:
        priorityClassName: 
        affinity:
          podAntiAffinity:
            # never schedule on a node running Timescape Lite with clickhouse to prevent accidentally mounting a PV twice
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                - key: hubble-timescape-lite-clickhouse
                  operator: Exists
              topologyKey: kubernetes.io/hostname
        containers:
          - name: clickhouse
            image: "quay.io/isovalent/clickhouse-server:25.8.11.66-alpine@sha256:32a477a44e92a37347e6df7684a1e6cce01f5af73d356e03ca13383da0bdf8b3"
            imagePullPolicy: IfNotPresent
            terminationMessagePolicy: FallbackToLogsOnError
            resources:
              {}
            volumeMounts:
              - name: data-storage-template
                mountPath: /var/lib/clickhouse
              - name: tls
                mountPath: "/etc/clickhouse-server/tls"
                readOnly: true
              - name: client-config
                mountPath: "/etc/clickhouse-client/"
                readOnly: true
              - name: ca
                mountPath: "/etc/clickhouse-server/ca"
                readOnly: true
              - mountPath: /etc/configs
                name: config
                readOnly: true
            env:
            readinessProbe:
              httpGet:
                path: /ping
                port: https
                scheme: HTTPS
            livenessProbe:
              httpGet:
                path: /ping
                port: https
                scheme: HTTPS
              initialDelaySeconds: 60
              periodSeconds: 3
            ports:
            - containerPort: 9440
              name: tcp
              protocol: TCP
            - containerPort: 8443
              name: https
              protocol: TCP
            - containerPort: 9009
              name: interserver
              protocol: TCP
            - containerPort: 8001
              name: metrics
              protocol: TCP
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              runAsGroup: 101
              runAsNonRoot: true
              runAsUser: 101
              seccompProfile:
                type: RuntimeDefault
        securityContext:
          fsGroup: 101
          seccompProfile:
            type: RuntimeDefault
        volumes:
        - name: tls
          projected:
            # need group read permissions so fsGroup can read the files
            defaultMode: 0440
            sources:
            - secret:
                items:
                - key: tls.crt
                  path: tls.crt
                - key: tls.key
                  path: tls.key
                name: hubble-timescape-clickhouse-cert
        - name: client-config
          projected:
            defaultMode: 0400
            sources:
            - configMap:
                items:
                - key: config.xml
                  path: config.xml
                name: hubble-timescape-clickhouse-client-config
        - name: ca
          projected:
            defaultMode: 0400
            sources:
            - configMap:
                items:
                - key: ca.crt
                  path: ca.crt
                name: selfsigned-ca-bundle
        - configMap:
            items:
            - key: config.yaml
              path: config.yaml
            name: config
          name: config
    serviceTemplates:
      - name: svc-template
        generateName: "clickhouse-{chi}"
        metadata:
          labels:
            # clickhouse-operator will also add its own set of labels
            metrics-service: 'true'
            helm.sh/chart: hubble-timescape-0.0.0
            app.kubernetes.io/name: hubble-timescape-clickhouse
            app.kubernetes.io/instance: hubble-timescape-clickhouse-release-name
            app.kubernetes.io/component: database
            app.kubernetes.io/part-of: hubble-timescape
            app.kubernetes.io/version: "0.0.0"
            app.kubernetes.io/managed-by: Helm
        spec:
          ports:
            - name: https
              port: 8443
            - name: tcp
              port: 9440
            - name: metrics
              port: 8001
          type: ClusterIP  # Avoid exposing the ClickHouse installation to outside.
    volumeClaimTemplates:
    - name: data-storage-template
      reclaimPolicy: Retain
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName:
