# Source: hubble-timescape/templates/analyzer_deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-timescape-analyzer
  namespace: default
  labels:
    helm.sh/chart: hubble-timescape-0.0.0
    app.kubernetes.io/name: hubble-timescape-analyzer
    app.kubernetes.io/instance: hubble-timescape-analyzer-release-name
    app.kubernetes.io/component: analyzer
    app.kubernetes.io/part-of: hubble-timescape
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hubble-timescape-analyzer
      app.kubernetes.io/instance: hubble-timescape-analyzer-release-name
      app.kubernetes.io/component: analyzer
      app.kubernetes.io/part-of: hubble-timescape
  template:
    metadata:
      annotations:
        hubble-timescape-analyzer-configmap-checksum: "46303d99fc5b527db4704b33f66c3106d9b577f708b58eb20e60875034983eb3"
      labels:
        app.kubernetes.io/name: hubble-timescape-analyzer
        app.kubernetes.io/instance: hubble-timescape-analyzer-release-name
        app.kubernetes.io/component: analyzer
        app.kubernetes.io/part-of: hubble-timescape
    spec:
      serviceAccountName: "hubble-timescape-analyzer"
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: 
      containers:
        - name: analyzer
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          image: "quay.io/isovalent/hubble-timescape:v1.18.1"
          imagePullPolicy: IfNotPresent
          terminationMessagePolicy: FallbackToLogsOnError
          command:
            - /usr/bin/hubble-timescape
          args:
            - analyze
          env:
            - name: HUBBLE_TIMESCAPE_CLICKHOUSE_USERNAME
              value: "timescape_analyzer"
            - name: HUBBLE_TIMESCAPE_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hubble-timescape-analyzer-creds
                  key: CLICKHOUSE_PASSWORD
            - name: HUBBLE_TIMESCAPE_DSN
              value: "clickhouse://clickhouse.example.com:9440/hubble?dial_timeout=10s&secure=true"
          ports:
            - name: analyze-health
              containerPort: 8081
              protocol: TCP
            - name: analyze-metrics
              containerPort: 9090
              protocol: TCP
            - name: analyze-pprof
              containerPort: 6060
              protocol: TCP
          startupProbe:
            grpc:
              port: 8081
        
            # The Timescape analyzer implement a retry logic to connect to
            # ClickHouse with a timeout of 10s retrying 30 times before giving
            # up and crashing. Thus, it is expected to exit on its own after 5
            # minutes if it can't be ready. Since the default k8s periodSeconds
            # is 10s, a failureThreshold of 32 leave to the container a little
            # over 5m. See https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#when-should-you-use-a-startup-probe
            failureThreshold: 32
          readinessProbe:
            grpc:
              port: 8081
          livenessProbe:
            grpc:
              port: 8081
          resources:
            {}
          volumeMounts:
          - mountPath: "/etc/hubble-timescape"
            name: analyzer-config
            readOnly: true
          
      volumes:
      - name: analyzer-config
        configMap:
          name: hubble-timescape-analyzer-config
          items:
          - key: config.yaml
            path: config.yaml
