      app.kubernetes.io/part-of: hubble-timescape
  template:
    metadata:
      annotations:
        hubble-timescape-server-configmap-checksum: "573301a83bb1a267069531e2e3290fa1f1f32d569e6ca43d94bab122fd0b4959"
      labels:
        app.kubernetes.io/name: hubble-timescape-server
        app.kubernetes.io/instance: hubble-timescape-server-release-name
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: hubble-timescape
    spec:
      serviceAccountName: "hubble-timescape-server"
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: 
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          image: "quay.io/isovalent/hubble-timescape:v1.18.1"
          imagePullPolicy: IfNotPresent
          terminationMessagePolicy: FallbackToLogsOnError
          command:
            - /usr/bin/hubble-timescape
          args:
            - serve
          env:
            - name: HUBBLE_TIMESCAPE_CLICKHOUSE_USERNAME
              value: "timescape_server"
            - name: HUBBLE_TIMESCAPE_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hubble-timescape-server-creds
                  key: CLICKHOUSE_PASSWORD
            - name: HUBBLE_TIMESCAPE_DSN
              value: "clickhouse://clickhouse.example.com:9440/hubble?dial_timeout=10s&secure=true"
          ports:
            - name: server-health
              containerPort: 8081
              protocol: TCP
            - name: server-grpc
              containerPort: 4244
              protocol: TCP
            - name: server-metrics
              containerPort: 9090
              protocol: TCP
            - name: server-pprof
              containerPort: 6060
              protocol: TCP
          startupProbe:
            grpc:
              port: 8081
        
            # The Timescape server implement a retry logic to connect to
            # ClickHouse with a timeout of 10s retrying 30 times before giving
            # up and crashing. Thus, it is expected to exit on its own after 5
            # minutes if it can't be ready. Since the default k8s periodSeconds
            # is 10s, a failureThreshold of 32 leave to the container a little
            # over 5m. See https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#when-should-you-use-a-startup-probe
            failureThreshold: 32
          readinessProbe:
            grpc:
              port: 8081
          livenessProbe:
            grpc:
              port: 8081
          resources:
            {}
          volumeMounts:
          - mountPath: "/etc/hubble-timescape"
            name: server-config
            readOnly: true
          - mountPath: "/var/lib/hubble-timescape/tls"
            name: server-tls
            readOnly: true
          
      volumes:
      - name: server-config
        configMap:
          name: hubble-timescape-server-config
          items:
          - key: config.yaml
            path: config.yaml
      - name: server-tls
        projected:
          defaultMode: 0400
          sources:
          - secret:
              name: hubble-timescape-server-cert
              items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
