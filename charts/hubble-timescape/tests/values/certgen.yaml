tls:
  enabled: true
  auto:
    enabled: true
    method: cronJob

certgen:
  extraVolumes:
    - name: config
      configMap:
        name: config
        items:
        - key: config.yaml
          path: config.yaml
  extraVolumeMounts:
    - mountPath: /etc/configs
      name: config
      readOnly: true

clickhouse:
  cluster:
    enabled: true
    volumes:
      data:
        size: 1Gi
  settings:
    queryLog:
      ttlDays: 2

ingester:
  server:
    http:
      enabled: true
