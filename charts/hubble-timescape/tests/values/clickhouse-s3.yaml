clickhouse:
  settings:
    storage:
      policy: s3
      s3:
        enabled: true
        # will use clickhouse.tls.ca.configMap from hubble-timescape-values.yaml
        tls:
          enabled: true
        endpoint: minio.minio.svc.cluster.local
        bucket: clickhouse
        path: data
        region: fake
        usePathStyleAccess: true
    systemLogs:
      enabled: false
      tables:
        queryLog:
          enabled: true
          ttl: 10 minute
  cluster:
    enabled: true
    volumes:
      data:
        size: 1Ti
        storageClassName: ""
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: hubble-timescape-clickhouse-s3-creds
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: hubble-timescape-clickhouse-s3-creds
            key: AWS_SECRET_ACCESS_KEY

ingester:
  bucket:
    uri: "s3://timescape/hubble-events?endpoint=https://minio.minio.svc.cluster.local&s3ForcePathStyle=true"
    prefixPattern: "%Y/%m/%d"
