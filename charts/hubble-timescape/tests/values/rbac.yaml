clickhouse:
  cluster:
    enabled: true
    volumes:
      data:
        size: 1Gi
        storageClassName: null
    extraVolumes:
      - name: config
        configMap:
          name: config
          items:
          - key: config.yaml
            path: config.yaml
    extraVolumeMounts:
      - mountPath: /etc/configs
        name: config
        readOnly: true

    podAnnotations:
      foo: bar

    podLabels:
      customLabel: customValue

    prometheus:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        rules:
          TimescapeClickhouseVolumeFillingUp:
            threshold: 0.3
            predictionTime: 24h
      tableMetrics:
        enabled: true

  tls:
    enabled: true
    auto:
      enabled: true
      method: certmanager
      certmanager:
        issuerRef:
          group: cert-manager.io
          kind: ClusterIssuer
          name: selfsigned-ca-issuer
    ca:
      configMap:
        name: "selfsigned-ca-bundle"
        key: "ca.crt"

trimmer:
  flowsCount: 1_000_000_000
  clickhouse:
    credentials:
      secretName: "custom-trimmer-creds"
  extraVolumes:
    - name: config
      configMap:
        name: config
        items:
        - key: config.yaml
          path: config.yaml
  extraVolumeMounts:
    - mountPath: /etc/configs
      name: config
      readOnly: true

  podAnnotations:
    foo: bar

  podLabels:
    customLabel: customValue

migrate:
  clickhouse:
    credentials:
      secretName: "custom-migrate-creds"
  flows:
    ttl: "168h"
  extraVolumeMounts:
    - mountPath: /etc/configs
      name: config
      readOnly: true

ingester:
  clickhouse:
    credentials:
      secretName: "custom-ingester-creds"
  bucket:
    uri: "s3://timescape/hubble-events?endpoint=https://minio.minio.svc.cluster.local&s3ForcePathStyle=true"
    prefixPattern: "%Y/%m/%d"
    tls:
      ca:
        configMap:
          name: "selfsigned-ca-bundle"
          key: "ca.crt"
  scheduleInterval: 1m
  flows:
    enabled: true
  server:
    authMethod: basic-auth
    http:
      enabled: true
    grpc:
      # grpc is not compatible with basic-auth and the chart should not enable it
      # when basic-auth is set.
      enabled: true
  extraVolumes:
    - name: config
      configMap:
        name: config
        items:
        - key: config.yaml
          path: config.yaml
  extraVolumeMounts:
    - mountPath: /etc/configs
      name: config
      readOnly: true

  prometheus:
    prometheusRule:
      enabled: true
    serviceMonitor:
      enabled: true

  pprof:
    enabled: true
    address: "0.0.0.0"
    port: 6060

  podAnnotations:
    phlare.grafana.com/scrape: "true"
    phlare.grafana.com/port: "6060"

  podLabels:
    customLabel: customValue

server:
  clickhouse:
    credentials:
      secretName: "custom-server-creds"
  tls:
    enabled: true
    auto:
      enabled: true
      method: certmanager
      certmanager:
        issuerRef:
          group: cert-manager.io
          kind: ClusterIssuer
          name: selfsigned-ca-issuer
    mtls:
      enabled: true
    clientCA:
      configMap:
        name: selfsigned-ca-bundle
        key: "ca.crt"
  prometheus:
    prometheusRule:
      enabled: true
    serviceMonitor:
      enabled: true

  pprof:
    enabled: true
    address: "0.0.0.0"
    port: 6060

  podAnnotations:
    phlare.grafana.com/scrape: "true"
    phlare.grafana.com/port: "6060"

  podLabels:
    customLabel: customValue

  extraVolumes:
    - name: config
      configMap:
        name: config
        items:
        - key: config.yaml
          path: config.yaml
  extraVolumeMounts:
    - mountPath: /etc/configs
      name: config
      readOnly: true

  rbac:
    loggingLevel: debug
    enabled: true
    authMethod: oidc,tls
    oidcURL: https://dex.172-18-0-2.sslip.io
    oidcClientID: hubble,grafana
    oidcCA:
      configMap:
        name: selfsigned-ca-bundle
        key: "ca.crt"
    tls:
      # server.rbac.tls.clientCA should take precedence
      # over server.tls.clientCA
      clientCA:
        configMap:
          name: selfsigned-ca-bundle-override
          key: "ca.override.crt"
    policy:
      logRoles: true
      mode: configMap
      configMap:
        bindings:
        # For okta
        - role: admin
          scope: hubble-rbac
          value: 'Everyone'
        # For dex
        - role: admin
          scope: email
          value: 'admin@example.com'
        - role: demos
          scope: email
          value: 'demo@example.com'
        roles:
        - name: demos
          rules:
            - actions:
                - get
              contexts:
                - field: namespace
                  values:
                    - kube-system
                    - tenant-jobs
              kind: flows
        - name: admin
          rules:
            - actions:
                - "*"
              kind: "*"
              allowAllContexts: true
ui:
  extraEnv:
    - name: FOO
      value: BAR
  enabled: true
  auth:
    oidc:
      extraFields:
        - key: id
          value: timescapeui-PROD
        - key: resource
          value: ISOVALENT:URI:RS-123456-789012-timescapeui-PROD
        - key: mykey
  ingress:
    enabled: true
    tls:
      enabled: true
      secretName: hubble-timescape-ui-ingress-cert
  extraVolumes:
    - name: config
      configMap:
        name: config
        items:
        - key: config.yaml
          path: config.yaml
  extraVolumeMounts:
    - mountPath: /etc/configs
      name: config
      readOnly: true

  prometheus:
    prometheusRule:
      enabled: true

  pprof:
    enabled: true
    address: "0.0.0.0"
    port: 6060

  podAnnotations:
    phlare.grafana.com/scrape: "true"
    phlare.grafana.com/port: "6060"

  podLabels:
    customLabel: customValue
