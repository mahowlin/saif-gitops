apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hubble-k8s-exporter.fullname" . }}
  labels:
    {{- include "hubble-k8s-exporter.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "hubble-k8s-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with include "hubble-k8s-exporter.podAnnotations" . }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hubble-k8s-exporter.podLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hubble-k8s-exporter.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: k8sexporter
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/bin/hubble-k8s-exporter
          args:
            - export
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: "/etc/hubble-k8s-exporter"
              name: config
              readOnly: true
            - mountPath: /var/run/cilium
              name: cilium-run
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "hubble-k8s-exporter.fullname" . }}
            items:
            - key: config.yaml
              path: config.yaml
        - name: cilium-run
          hostPath:
            path: /var/run/cilium
            type: DirectoryOrCreate
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
