{{- define "hubble-timescape-certgen.rbacRules" -}}
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - create
- apiGroups:
    - ""
  resources:
    - secrets
  resourceNames:
    - hubble-timescape-server-cert
    - hubble-timescape-ingester-server-cert
    - hubble-timescape-clickhouse-cert
  verbs:
    - update
- apiGroups:
    - ""
  resources:
    - secrets
  resourceNames:
    - hubble-timescape-ca
  verbs:
    - get
    - update
{{- end }}
{{- if (include "hubble-timescape-certgen.enabled" .) }}
{{- if .Values.certgen.serviceAccount.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hubble-timescape-certgen.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hubble-timescape-certgen.labels" . | nindent 4 }}
rules: {{- include "hubble-timescape-certgen.rbacRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hubble-timescape-certgen.name" . }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hubble-timescape-certgen.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
rules: {{- include "hubble-timescape-certgen.rbacRules" . | nindent 2 }}
{{ end }}
{{- end }}
