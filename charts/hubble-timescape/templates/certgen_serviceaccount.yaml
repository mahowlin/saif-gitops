{{- if (include "hubble-timescape-certgen.enabled" .) }}
{{- if .Values.certgen.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.certgen.serviceAccount.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hubble-timescape-certgen.labels" . | nindent 4 }}
  {{- if .Values.certgen.serviceAccount.annotations }}
  annotations:
    {{- toYaml .Values.certgen.serviceAccount.annotations | indent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ print .Values.certgen.serviceAccount.name "-init" | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hubble-timescape-certgen.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
  {{- if .Values.certgen.serviceAccount.annotations }}
    {{- toYaml .Values.certgen.serviceAccount.annotations | indent 4 }}
  {{- end }}
{{ end }}
{{- end }}
