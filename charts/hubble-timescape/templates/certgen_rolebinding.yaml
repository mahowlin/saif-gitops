{{- if (include "hubble-timescape-certgen.enabled" .) }}
{{- if .Values.certgen.serviceAccount.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hubble-timescape-certgen.name" . }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hubble-timescape-certgen.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hubble-timescape-certgen.name" . }}-init
subjects:
- kind: ServiceAccount
  name: {{ print .Values.certgen.serviceAccount.name "-init" | quote }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hubble-timescape-certgen.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hubble-timescape-certgen.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hubble-timescape-certgen.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.certgen.serviceAccount.name | quote }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
