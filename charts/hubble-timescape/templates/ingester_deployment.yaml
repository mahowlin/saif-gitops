{{- if and (not .Values.lite.enabled) .Values.ingester.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hubble-timescape-ingester.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hubble-timescape-ingester.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ingester.replicaCount }}
  strategy:
      {{- .Values.ingester.updateStrategy | toYaml | nindent 4}}
  selector:
    matchLabels:
      {{- include "hubble-timescape-ingester.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with include "hubble-timescape-ingester.podAnnotations" . }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hubble-timescape-ingester.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.ingester.serviceAccount.name | quote }}
      {{- with  concat .Values.ingester.image.pullSecrets .Values.migrate.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.ingester.podSecurityContext | nindent 8 }}
      priorityClassName: {{ .Values.ingester.priorityClassName }}
      initContainers: {{- include "hubble-timescape-migrate.container" . | nindent 8 }}
      containers: {{- include "hubble-timescape-ingester.container" . | nindent 8 }}
      volumes: {{- include "hubble-timescape-ingester.volumes" . | nindent 6 }}
      {{- with .Values.ingester.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingester.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingester.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
