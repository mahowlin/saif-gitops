{{- if and .Values.lite.enabled .Values.lite.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.lite.serviceAccount.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hubble-timescape-lite.labels" . | nindent 4 }}
  {{- if .Values.lite.serviceAccount.annotations }}
  annotations:
{{ toYaml .Values.lite.serviceAccount.annotations | indent 4 }}
  {{- end }}
{{- end }}
