{{- if and .Values.ingester.enabled .Values.ingester.k8sImporter.enabled (not .Values.lite.enabled) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hubble-timescape-ingester.fullname" . }}-k8s-importer
  labels:
    {{- include "hubble-timescape-ingester.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hubble-timescape-ingester.fullname" . }}-k8s-importer
subjects:
- kind: ServiceAccount
  name: {{ .Values.ingester.serviceAccount.name | quote }}
  namespace: {{ .Release.Namespace }}
{{- end }}
