{{- if .Values.lite.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hubble-timescape-lite.service.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hubble-timescape-lite.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "hubble-timescape-lite.selectorLabels" . | nindent 4 }}
{{- end }}
