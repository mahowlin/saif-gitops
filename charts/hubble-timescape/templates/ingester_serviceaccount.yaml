{{- if and .Values.ingester.enabled .Values.ingester.serviceAccount.create (not .Values.lite.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.ingester.serviceAccount.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hubble-timescape-ingester.labels" . | nindent 4 }}
  {{- if .Values.ingester.serviceAccount.annotations }}
  annotations:
{{ toYaml .Values.ingester.serviceAccount.annotations | indent 4 }}
  {{- end }}
{{- end }}
