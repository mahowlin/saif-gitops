{{- if .Values.lite.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hubble-timescape-lite.fullname" . }}-k8s-importer
  labels:
    {{- include "hubble-timescape-lite.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hubble-timescape-lite.fullname" . }}-k8s-importer
subjects:
- kind: ServiceAccount
  name: {{ .Values.lite.serviceAccount.name | quote }}
  namespace: {{ .Release.Namespace }}
{{- if and .Values.ui.enabled .Values.ui.loadBalancing.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hubble-timescape-lite.fullname" . }}-ilb
  labels:
    {{- include "hubble-timescape-lite.labels" . | nindent 4 }}
    {{- with .Values.ui.loadBalancing.clusterRoleBinding.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ui.loadBalancing.clusterRoleBinding.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hubble-timescape-lite.fullname" . }}-ilb
subjects:
- kind: ServiceAccount
  name: {{ .Values.lite.serviceAccount.name | quote }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
