{{- if and .Values.analyzer.enabled .Values.analyzer.serviceAccount.create (not .Values.lite.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.analyzer.serviceAccount.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hubble-timescape-analyzer.labels" . | nindent 4 }}
  {{- if .Values.analyzer.serviceAccount.annotations }}
  annotations:
{{ toYaml .Values.analyzer.serviceAccount.annotations | indent 4 }}
  {{- end }}
{{- end }}
