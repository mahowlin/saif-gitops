{{- if and .Values.trimmer.flowsCount .Values.trimmer.serviceAccount.create (not .Values.lite.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.trimmer.serviceAccount.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hubble-timescape-trimmer.labels" . | nindent 4 }}
  {{- if .Values.trimmer.serviceAccount.annotations }}
  annotations:
    {{- toYaml .Values.trimmer.serviceAccount.annotations | indent 4 }}
  {{- end }}
{{- end }}
