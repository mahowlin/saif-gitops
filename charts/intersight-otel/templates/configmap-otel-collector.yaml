# OpenTelemetry Collector configuration
# Receives metrics from intersight-otel and exports to Splunk
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: intersight-otel
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 10s
      memory_limiter:
        limit_mib: 512
        spike_limit_mib: 128
        check_interval: 5s
      resource:
        attributes:
          - key: k8s.cluster.name
            value: {{ printf "%s.example.com" .Values.clusterName }}
            action: upsert

    exporters:
      signalfx:
        access_token: "${SPLUNK_ACCESS_TOKEN}"
        realm: {{ .Values.splunk.realm }}
        api_url: {{ .Values.splunk.apiUrl }}
        ingest_url: {{ .Values.splunk.ingestUrl }}
      debug:
        verbosity: basic

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [signalfx, debug]
