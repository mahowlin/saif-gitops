{{- if .Values.ciliumConfig.enabled }}
# PostSync Hook - Restart Cilium agents and operator after CiliumConfig changes
apiVersion: batch/v1
kind: Job
metadata:
  name: cilium-restart-{{ .Release.Revision }}
  namespace: cilium
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 660
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: cilium-restart-sa
      restartPolicy: Never
      containers:
        - name: restart
          image: {{ required "ciliumConfig.restartJobImage is required" .Values.ciliumConfig.restartJobImage }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Restarting Cilium agents to pick up CiliumConfig changes..."
              oc rollout restart daemonset/cilium -n cilium
              echo "Waiting for Cilium agent rollout to complete..."
              oc rollout status daemonset/cilium -n cilium --timeout=300s
              echo "Restarting Cilium operator to activate controller changes..."
              oc rollout restart deployment/cilium-operator -n cilium
              echo "Waiting for Cilium operator rollout to complete..."
              oc rollout status deployment/cilium-operator -n cilium --timeout=300s
              echo "Cilium agent and operator restarts complete."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cilium-restart-sa
  namespace: cilium
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cilium-restart-role
  namespace: cilium
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cilium-restart-binding
  namespace: cilium
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cilium-restart-role
subjects:
  - kind: ServiceAccount
    name: cilium-restart-sa
    namespace: cilium
{{- end }}
