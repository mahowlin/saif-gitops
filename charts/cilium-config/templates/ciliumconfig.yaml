{{ if .Values.ciliumConfig.enabled }}
# CiliumConfig - Managed by ArgoCD Day 2
# This CR controls the Cilium operator configuration
apiVersion: cilium.io/v1alpha1
kind: CiliumConfig
metadata:
  name: ciliumconfig
  labels:
    app.kubernetes.io/name: clife
    app.kubernetes.io/managed-by: argocd
spec:
  {{ if .Values.imageOverride.cilium.enabled }}
  # Cilium agent image override
  image:
    repository: {{ required "imageOverride.cilium.repository is required" .Values.imageOverride.cilium.repository | quote }}
    tag: {{ required "imageOverride.cilium.tag is required" .Values.imageOverride.cilium.tag | quote }}
    digest: {{ required "imageOverride.cilium.digest is required" .Values.imageOverride.cilium.digest | quote }}
    useDigest: true

  {{ end }}
  {{ if .Values.imageOverride.envoy.enabled }}
  # Cilium Envoy image override
  envoy:
    image:
      repository: {{ required "imageOverride.envoy.repository is required" .Values.imageOverride.envoy.repository | quote }}
      tag: {{ required "imageOverride.envoy.tag is required" .Values.imageOverride.envoy.tag | quote }}
      digest: {{ required "imageOverride.envoy.digest is required" .Values.imageOverride.envoy.digest | quote }}
      useDigest: true

  {{ end }}
  # Cluster identification
  cluster:
    name: {{ required "clusterName is required" .Values.clusterName }}

  # Security context (required for CNI)
  securityContext:
    privileged: true

  {{- $devices := .Values.ciliumConfig.devices | default list }}
  {{- if and (empty $devices) .Values.ciliumConfig.device }}
  {{- $devices = list .Values.ciliumConfig.device }}
  {{- end }}
  {{- $directRoutingDevice := .Values.ciliumConfig.directRoutingDevice | default .Values.ciliumConfig.device }}
  {{- if $devices }}
  # Device configuration - host interfaces eligible for the Cilium datapath
  devices:
  {{- range $devices }}
    - {{ . }}
  {{- end }}
  {{- end }}

  {{ if $directRoutingDevice }}
  # NodePort configuration
  nodePort:
    directRoutingDevice: {{ $directRoutingDevice }}
  {{ end }}

  # Routing mode - VXLAN tunnel
  routingMode: tunnel
  tunnelProtocol: vxlan
  autoDirectNodeRoutes: false

  # Socket LB for OpenShift Virtualization support
  socketLB:
    hostNamespaceOnly: true

  # IPAM configuration
  ipam:
    mode: "cluster-pool"
    operator:
      clusterPoolIPv4PodCIDRList:
        - {{ required "ciliumConfig.ipam.cidr is required" .Values.ciliumConfig.ipam.cidr | quote }}
      clusterPoolIPv4MaskSize: {{ .Values.ciliumConfig.ipam.hostPrefix | default 24 }}

  # CNI configuration
  cni:
    binPath: "/var/lib/cni/bin"
    confPath: "/var/run/multus/cni/net.d"
    exclusive: false

  clusterHealthPort: 9940

  extraConfig:
    hubble-connectionlog-export-enabled: "true"

  # Kube-proxy replacement
  kubeProxyReplacement: true
  k8sServiceHost: {{ required "ciliumConfig.apiHost is required" .Values.ciliumConfig.apiHost }}
  k8sServicePort: 6443

  sessionAffinity: true

  bpf:
    masquerade: true

  # Hubble observability
  hubble:
    enabled: true
    relay:
      enabled: true
      {{ if .Values.imageOverride.hubbleRelay.enabled }}
      image:
        repository: {{ required "imageOverride.hubbleRelay.repository is required" .Values.imageOverride.hubbleRelay.repository | quote }}
        tag: {{ required "imageOverride.hubbleRelay.tag is required" .Values.imageOverride.hubbleRelay.tag | quote }}
        digest: {{ required "imageOverride.hubbleRelay.digest is required" .Values.imageOverride.hubbleRelay.digest | quote }}
        useDigest: true
      {{ end }}
    ui:
      enabled: false
    # Flow export to file for Vector/Timescape ingestion
    export:
      static:
        enabled: true
        filePath: /var/run/cilium/hubble/hubble.log
        fileMaxSizeMb: 10
        fileMaxBackups: 5
    # Connection log export for Timescape Connections tab
    connectionLog:
      export:
        enabled: true
        filePath: /var/run/cilium/hubble/connectionlog.log
        fileMaxSizeMb: 10
        fileMaxBackups: 5
    metrics:
      enabled:
        - dns:labelsContext=source_namespace,destination_namespace
        - drop:labelsContext=source_namespace,destination_namespace
        - tcp:labelsContext=source_namespace,destination_namespace
        - icmp:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
        - flow:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace
        - policy:sourceContext=app|workload-name|pod|reserved-identity;destinationContext=app|workload-name|pod|dns|reserved-identity;labelsContext=source_namespace,destination_namespace

  # Prometheus monitoring
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

  operator:
    replicas: 1
    {{ if .Values.imageOverride.operator.enabled }}
    image:
      repository: {{ required "imageOverride.operator.repository is required" .Values.imageOverride.operator.repository | quote }}
      tag: {{ required "imageOverride.operator.tag is required" .Values.imageOverride.operator.tag | quote }}
      genericDigest: {{ required "imageOverride.operator.genericDigest is required" .Values.imageOverride.operator.genericDigest | quote }}
      useDigest: true
      {{ if .Values.imageOverride.operator.suffix }}
      suffix: {{ .Values.imageOverride.operator.suffix | quote }}
      {{ end }}
    {{ end }}
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true

  # L2 Announcements for LoadBalancer IPs
  l2announcements:
    enabled: {{ .Values.l2.enabled }}

  # Gateway API controller
  gatewayAPI:
    enabled: {{ .Values.gatewayAPI.enabled }}

  # Enterprise features
  enterprise:
    featureGate:
      approved:
        - EgressGatewayHA
        - EgressGatewayIPv4
        {{ if .Values.l2.enabled }}
        - L2Announcement
        {{ end }}
        {{ if .Values.gatewayAPI.enabled }}
        - GatewayAPI
        {{ end }}
        {{ if .Values.bgp.enabled }}
        - EnterpriseBGPControlPlane
        {{ end }}
        {{ if .Values.bgp.bfd.enabled }}
        - BFD
        {{ end }}
        {{ if .Values.bgp.routeImport.enabled }}
        - BGPRouteImport
        {{ end }}
        {{ if .Values.privateNetworks.enabled }}
        - PrivateNetworks
        {{ if eq .Values.privateNetworks.mode "local-access" }}
        - PrivateNetworkLocalAccess
        {{ end }}
        {{ end }}
    bgpControlPlane:
      enabled: {{ .Values.bgp.enabled }}
      {{ if .Values.bgp.routeImport.enabled }}
      routeImport:
        enabled: true
      {{ end }}
    {{ if .Values.bgp.bfd.enabled }}
    bfd:
      enabled: true
    {{ end }}
    egressGatewayHA:
      enabled: true
    {{ if .Values.privateNetworks.enabled }}
    privateNetworks:
      enabled: true
      mode: {{ .Values.privateNetworks.mode | quote }}
      networkAttachmentDefinitions:
        enabled: {{ .Values.privateNetworks.networkAttachmentDefinitions.enabled }}
      webhook:
        enabled: {{ .Values.privateNetworks.webhook.enabled }}
        vms:
          {{ if .Values.privateNetworks.webhook.vms.networkBinding }}
          networkBinding: {{ .Values.privateNetworks.webhook.vms.networkBinding | quote }}
          {{ end }}
    {{ end }}
{{ end }}
